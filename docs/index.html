  // ---------- state ----------

  function defaultCategoriesAndTasks() {
    var now = nowIso();
    var categories = [
      { id: uid("cat"), name: "Productivity Improvement", color: CATEGORY_PALETTE[0], order: 0, archived: false, createdAt: now, archivedAt: null },
      { id: uid("cat"), name: "Career Development", color: CATEGORY_PALETTE[1], order: 1, archived: false, createdAt: now, archivedAt: null },
      { id: uid("cat"), name: "Health & Well-being", color: CATEGORY_PALETTE[2], order: 2, archived: false, createdAt: now, archivedAt: null }
    ];
    var allDays = [0, 1, 2, 3, 4, 5, 6];
    var weekdays = [1, 2, 3, 4, 5];
    var tasks = [
      { id: uid("tsk"), categoryId: categories[0].id, name: "Deep work block", scheduledDays: allDays, nonNegotiable: true, order: 0, archived: false, createdAt: now, archivedAt: null },
      { id: uid("tsk"), categoryId: categories[1].id, name: "Job search action", scheduledDays: weekdays, nonNegotiable: true, order: 0, archived: false, createdAt: now, archivedAt: null },
      { id: uid("tsk"), categoryId: categories[2].id, name: "Move your body", scheduledDays: allDays, nonNegotiable: false, order: 0, archived: false, createdAt: now, archivedAt: null }
    ];
    return { categories: categories, tasks: tasks };
  }

  function createDefaultState() {
    var seed = defaultCategoriesAndTasks();
    return {
      schemaVersion: 1,
      createdAt: nowIso(),
      settings: {},
      categories: seed.categories,
      tasks: seed.tasks,
      statusesByTask: {},
      planCards: [],
      gymBlocks: [],
      goals: [],
      learningItems: [],
      learningSessions: [],
      learningNotes: [],
      projects: [],
      projectTasks: [],
      identityStatement: "",
      expenses: [],
      debts: [],
      debtPayments: [],
      savingsGoals: [],
      journalEntries: []
    };
  }

  function loadState() {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      var fresh = createDefaultState();
      saveState(fresh);
      return fresh;
    }
    try {
      var parsed = JSON.parse(raw);
      if (parsed.schemaVersion !== 1) console.warn("Momentum: unrecognized schemaVersion", parsed.schemaVersion, "- loading as-is.");
      var migrated = false;
      if (!parsed.goals) { parsed.goals = []; migrated = true; }
      // Schedule blocks can no longer link to a task — resolve any
      // existing link into a plain label (and the linked task's category
      // color, if the block had none of its own) before dropping taskId,
      // so a previously task-linked block doesn't go blank.
      (parsed.scheduleBlocks || []).forEach(function (b) {
        if (b.taskId !== undefined) {
          if (b.taskId && !b.label) {
            var linkedTask = parsed.tasks.find(function (t) { return t.id === b.taskId; });
            if (linkedTask) {
              b.label = linkedTask.name || "New block";
              if (!b.color) {
                var linkedCat = parsed.categories.find(function (c) { return c.id === linkedTask.categoryId; });
                if (linkedCat) b.color = linkedCat.color;
              }
            }
          }
          if (!b.label) b.label = "New block";
          delete b.taskId;
          migrated = true;
        }
      });
      // The weekly Calendar was replaced by the Day Plan — turn its blocks
      // into plan cards (once) and drop the old array.
      if (!parsed.planCards) { parsed.planCards = blocksToPlanCards(parsed.scheduleBlocks || []); migrated = true; }
      if (parsed.scheduleBlocks) { delete parsed.scheduleBlocks; migrated = true; }
      if (!parsed.gymBlocks) { parsed.gymBlocks = []; migrated = true; }
      if (!parsed.learningItems) { parsed.learningItems = []; migrated = true; }
      if (!parsed.learningSessions) { parsed.learningSessions = []; migrated = true; }
      if (!parsed.learningNotes) { parsed.learningNotes = []; migrated = true; }
      if (!parsed.projects) { parsed.projects = []; migrated = true; }
      if (!parsed.projectTasks) { parsed.projectTasks = []; migrated = true; }
      // Project tasks moved from a done tick to a To Do / In Progress /
      // Done status (kanban) — a ticked task becomes "done", others "todo".
      parsed.projectTasks.forEach(function (t) {
        if (t.status) return;
        t.status = t.done ? "done" : "todo";
        delete t.done;
        migrated = true;
      });
      // Exercises are now just typed names — the old dropdown list goes.
      if (parsed.gymExercises) { delete parsed.gymExercises; migrated = true; }
      // Gym blocks no longer carry a duration — drop any stored one.
      parsed.gymBlocks.forEach(function (b) { if (b.durationMin !== undefined) { delete b.durationMin; migrated = true; } });
      // Gym days briefly followed a task picked from a dropdown; they now
      // always follow the task named "Workout", so the stored pick goes.
      if (parsed.gymTaskId !== undefined) { delete parsed.gymTaskId; migrated = true; }
      // Plan cards predate the Business plan — they all belong to Day Plan.
      parsed.planCards.forEach(function (c) { if (!c.plan) { c.plan = "day"; migrated = true; } });
      // Plan cards briefly stored only a duration — give those a From/To,
      // stacked back to back from 08:00 in their column's order.
      ["workday", "weekend"].forEach(function (col) {
        var at = 8 * 60;
        parsed.planCards.filter(function (c) { return c.column === col; })
          .sort(function (a, b) { return a.order - b.order; })
          .forEach(function (c) {
            if (c.startTime) return;
            c.startTime = minutesToClock(at);
            c.endTime = minutesToClock(at + (c.durationMin || 60));
            at += c.durationMin || 60;
            delete c.durationMin;
            migrated = true;
          });
      });
      // Flex day was removed app-wide — drop the old setting if present.
      if (parsed.settings && parsed.settings.flexDayOfWeek !== undefined) { delete parsed.settings.flexDayOfWeek; migrated = true; }
      // Floor/target were dropped as a task concept entirely (not just
      // hidden from the grid) — default nonNegotiable on older tasks and
      // strip any leftover floor/target text so it doesn't linger unused.
      parsed.tasks.forEach(function (t) {
        if (t.nonNegotiable === undefined) { t.nonNegotiable = false; migrated = true; }
        if (t.floor !== undefined) { delete t.floor; migrated = true; }
        if (t.target !== undefined) { delete t.target; migrated = true; }
        // A task with no scheduled days is never "applicable" anywhere, so
        // its % / streak / dashboard stats silently read as "—". That's
        // always a mistake — restore it to every day.
        if (!Array.isArray(t.scheduledDays) || t.scheduledDays.length === 0) {
          t.scheduledDays = [0, 1, 2, 3, 4, 5, 6];
          migrated = true;
        }
      });
      // identityStatement replaced the earlier identityStatements list (Phase 4
      // is now a single free-text block, not several editable entries) — fold
      // any old entries into the new field once, then drop the old array.
      if (parsed.identityStatement == null) {
        migrated = true;
        if (Array.isArray(parsed.identityStatements) && parsed.identityStatements.length > 0) {
          parsed.identityStatement = parsed.identityStatements
            .slice().sort(function (a, b) { return a.order - b.order; })
            .map(function (s) { return s.text; })
            .filter(Boolean)
            .join("\n\n");
        } else {
          parsed.identityStatement = "";
        }
      }
      if (parsed.identityStatements !== undefined) { delete parsed.identityStatements; migrated = true; }
      // `percent` is now the MANUAL-fallback progress; live progress is
      // derived (see goalEffectiveProgress) from linked Input Tracker tasks
      // (short-term) or linked child goals (mid/long). `parentGoalId` is
      // back (it had been removed) to carry the child->parent link the
      // roll-up needs. Old status/percent progress-mode fields still get
      // folded onto `percent` then dropped. No-horizon goals default "mid".
      parsed.goals.forEach(function (g) {
        if (!g.horizon) { g.horizon = "mid"; migrated = true; }
        if (g.deadline === undefined) { g.deadline = null; migrated = true; }
        if (g.progressMode === "status" && g.status && g.status !== "not_started") {
          g.percent = g.status === "done" ? 100 : 50;
          migrated = true;
        }
        if (g.percent == null) { g.percent = 0; migrated = true; }
        if (g.progressMode !== undefined) { delete g.progressMode; migrated = true; }
        if (g.status !== undefined) { delete g.status; migrated = true; }
        if (g.parentGoalId === undefined) { g.parentGoalId = null; migrated = true; }
        if (g.linkedTaskIds === undefined) { g.linkedTaskIds = []; migrated = true; }
        if (g.linkType === undefined) { g.linkType = null; migrated = true; }
        if (g.countTarget === undefined) { g.countTarget = null; migrated = true; }
      });
      if (!parsed.expenses) { parsed.expenses = []; migrated = true; }
      if (!parsed.debts) { parsed.debts = []; migrated = true; }
      if (!parsed.debtPayments) { parsed.debtPayments = []; migrated = true; }
      if (!parsed.savingsGoals) { parsed.savingsGoals = []; migrated = true; }
      if (!parsed.journalEntries) { parsed.journalEntries = []; migrated = true; }
      if (migrated) saveState(parsed); // persist the migrated shape immediately, not just on the user's next edit
      return parsed;
    } catch (e) {
      console.error("Momentum: stored state was corrupt, starting fresh.", e);
      var reset = createDefaultState();
      saveState(reset);
      return reset;
    }
  }

  function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

  // ---------- categories ----------

  function activeCategories(s) {
    return s.categories.filter(function (c) { return !c.archived; }).sort(function (a, b) { return a.order - b.order; });
  }

  function nextCategoryColor(s) { return CATEGORY_PALETTE[s.categories.length % CATEGORY_PALETTE.length]; }

  function addCategory(s) {
    var maxOrder = s.categories.reduce(function (m, c) { return Math.max(m, c.order); }, -1);
    var cat = { id: uid("cat"), name: "", color: nextCategoryColor(s), order: maxOrder + 1, archived: false, createdAt: nowIso(), archivedAt: null };
    s.categories.push(cat);
    saveState(s);
    return cat;
  }

  function updateCategoryField(s, id, field, value) {
    var c = s.categories.find(function (x) { return x.id === id; });
    if (!c) return;
    c[field] = value;
    saveState(s);
  }

  function archiveCategory(s, id) {
    var c = s.categories.find(function (x) { return x.id === id; });
    if (!c) return;
    c.archived = true;
    c.archivedAt = nowIso();
    s.tasks.filter(function (t) { return t.categoryId === id && !t.archived; }).forEach(function (t) {
      t.archived = true;
      t.archivedAt = nowIso();
    });
    saveState(s);
  }

  // ---------- tasks ----------

  function activeTasksInCategory(s, categoryId) {
    return s.tasks.filter(function (t) { return t.categoryId === categoryId && !t.archived; }).sort(function (a, b) { return a.order - b.order; });
  }

  function addTask(s, categoryId) {
    var siblings = s.tasks.filter(function (t) { return t.categoryId === categoryId; });
    var maxOrder = siblings.reduce(function (m, t) { return Math.max(m, t.order); }, -1);
    var task = {
      id: uid("tsk"), categoryId: categoryId, name: "",
      scheduledDays: [0, 1, 2, 3, 4, 5, 6], nonNegotiable: false, order: maxOrder + 1,
      archived: false, createdAt: nowIso(), archivedAt: null
    };
    s.tasks.push(task);
    saveState(s);
    return task;
  }

  function updateTaskField(s, id, field, value) {
    var t = s.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    t[field] = value;
    saveState(s);
  }

  // Returns true if the toggle was applied. A task must keep at least one
  // scheduled day — otherwise it's never "applicable" and its %, streak,
  // and dashboard stats all silently read as "—".
  function toggleTaskScheduledDay(s, id, dayIdx) {
    var t = s.tasks.find(function (x) { return x.id === id; });
    if (!t) return false;
    var i = t.scheduledDays.indexOf(dayIdx);
    if (i === -1) t.scheduledDays.push(dayIdx);
    else if (t.scheduledDays.length > 1) t.scheduledDays.splice(i, 1);
    else return false; // can't remove the last day
    t.scheduledDays.sort(function (a, b) { return a - b; });
    saveState(s);
    return true;
  }

  function archiveTask(s, id) {
    var t = s.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    t.archived = true;
    t.archivedAt = nowIso();
    saveState(s);
  }

  // ---------- daily status ----------

  function isTaskScheduledOn(task, dateKey) {
    var dow = parseDateKey(dateKey).getDay();
    return task.scheduledDays.indexOf(dow) !== -1;
  }

  function derivedTaskStatus(s, task, dateKey) {
    if (!isTaskScheduledOn(task, dateKey)) return "na";
    var stored = s.statusesByTask[task.id] && s.statusesByTask[task.id][dateKey];
    if (stored === "done" || stored === "not_done") return stored;
    return "todo";
  }

  function setTaskStatus(s, taskId, dateKey, status) {
    if (!s.statusesByTask[taskId]) s.statusesByTask[taskId] = {};
    if (status) s.statusesByTask[taskId][dateKey] = status;
    else delete s.statusesByTask[taskId][dateKey];
    saveState(s);
  }

  // Single tap cycles: todo -> done -> not_done -> todo.
  function cycleTaskStatus(s, taskId, dateKey) {
    var current = s.statusesByTask[taskId] && s.statusesByTask[taskId][dateKey];
    var next = current === "done" ? "not_done" : current === "not_done" ? null : "done";
    setTaskStatus(s, taskId, dateKey, next);
  }

  // ---------- applicability + calculations (see docs/DATA-MODEL.md) ----------

  function isTaskApplicableOn(task, dateKey, todayKey) {
    var createdKey = localDateKey(new Date(task.createdAt));
    if (createdKey > dateKey) return false;
    if (task.archived && task.archivedAt) {
      var archivedKey = localDateKey(new Date(task.archivedAt));
      if (archivedKey <= dateKey) return false;
    }
    if (!isTaskScheduledOn(task, dateKey)) return false;
    if (dateKey > todayKey) return false;
    return true;
  }

  function computeTaskAccomplishment(s, task, todayKey) {
    var createdKey = localDateKey(new Date(task.createdAt));
    var done = 0, applicable = 0;
    var cursor = parseDateKey(createdKey);
    while (localDateKey(cursor) <= todayKey) {
      var dk = localDateKey(cursor);
      if (isTaskApplicableOn(task, dk, todayKey)) {
        applicable++;
        var st = s.statusesByTask[task.id] && s.statusesByTask[task.id][dk];
        if (st === "done") done++;
      }
      cursor = addDays(cursor, 1);
    }
    if (applicable === 0) return null;
    return { done: done, applicable: applicable, pct: Math.round((done / applicable) * 100) };
  }

  // Accomplishment for one specific week — this is what the Input Tracker's
  // "Week %" column shows. Denominator is EVERY day the task is scheduled
  // in that week (the whole Mon–Sun span — days already past, today, and
  // weekdays still to come), so marking one day done reads as "1 of 5 this
  // week = 20%", not 100%. The per-day createdAt/archivedAt gate is
  // deliberately dropped here: within a week the task is active for, all of
  // that week's scheduled slots count (the same cells the grid lets you
  // tick). Only a week lying entirely outside the task's lifetime returns
  // null ("—"). `weekDates` is the 7 Date objects the tracker already built.
  function computeTaskWeekAccomplishment(s, task, weekDates, todayKey) {
    var createdKey = localDateKey(new Date(task.createdAt));
    var archivedKey = task.archived && task.archivedAt ? localDateKey(new Date(task.archivedAt)) : null;
    var weekStartKey = localDateKey(weekDates[0]);
    var weekEndKey = localDateKey(weekDates[weekDates.length - 1]);
    if (weekEndKey < createdKey) return null;            // whole week before the task existed
    if (archivedKey && weekStartKey >= archivedKey) return null; // whole week after it was archived
    var done = 0, scheduled = 0;
    weekDates.forEach(function (d) {
      var dk = localDateKey(d);
      if (!isTaskScheduledOn(task, dk)) return; // N/A weekday — never counts
      scheduled++;
      var st = s.statusesByTask[task.id] && s.statusesByTask[task.id][dk];
      if (st === "done") done++;
    });
    if (scheduled === 0) return null;
    return { done: done, scheduled: scheduled, pct: Math.round((done / scheduled) * 100) };
  }

  // Which bucket a single task-day falls into, or null if it isn't an entry
  // at all (before the task existed, after it was archived, or in the
  // future). "na" = the task exists that day but isn't scheduled on that
  // weekday. Used by the Dashboard's range stats.
  function taskDayBucket(s, task, dateKey, todayKey) {
    if (dateKey > todayKey) return null;
    if (localDateKey(new Date(task.createdAt)) > dateKey) return null;
    if (task.archived && task.archivedAt && localDateKey(new Date(task.archivedAt)) <= dateKey) return null;
    if (!isTaskScheduledOn(task, dateKey)) return "na";
    var st = s.statusesByTask[task.id] && s.statusesByTask[task.id][dateKey];
    if (st === "done") return "done";
    if (st === "not_done") return "not_done";
    return "todo";
  }

  // Non-negotiable task-entries count double an "other" one toward every
  // weighted % this app computes — at the user's explicit request, applied
  // everywhere (the Dashboard headline, both charts, the per-category grid,
  // the Progress-over-time chart, and the Discipline Level streak all share
  // this one definition now, rather than the headline staying flat while
  // Discipline Level alone was weighted, which read as two silently
  // different "done %" numbers). `done`/`applicable`/`totals` stay raw,
  // literal entry counts throughout — only the derived *percentage* is
  // reinterpreted through the weighting; a count like "3 of 4 entries" or
  // a legend's "(3)" still reports what literally happened.
  var NON_NEGOTIABLE_WEIGHT = 2;

  function weightedPct(nonneg, other) {
    var totalWeight = nonneg.applicable * NON_NEGOTIABLE_WEIGHT + other.applicable;
    if (!totalWeight) return null;
    var doneWeight = nonneg.done * NON_NEGOTIABLE_WEIGHT + other.done;
    return Math.round((doneWeight / totalWeight) * 100);
  }

  // One pass over every task-day in [startKey, endKey] (clamped to today),
  // for tasks whose category is still active. Feeds the whole Dashboard:
  // headline %, the two charts, the non-negotiable/other card, the KPI grid.
  //   totals / byCat[i] : { done, not_done, todo, na } entry counts
  //   byGroup           : { nonneg, other } each { done, applicable }
  //   applicable        : done + not_done + todo (NA excluded)
  //   pct               : weightedPct(byGroup.nonneg, byGroup.other) — a
  //                        non-negotiable entry counts double; see
  //                        weightedPct, above
  function computeRangeStats(s, startKey, endKey, todayKey) {
    var end = endKey < todayKey ? endKey : todayKey;
    var cats = activeCategories(s);
    var idxById = {};
    var byCat = cats.map(function (c, i) {
      idxById[c.id] = i;
      return {
        id: c.id, name: c.name, color: c.color, done: 0, not_done: 0, todo: 0, na: 0,
        nonneg: { done: 0, applicable: 0 }, other: { done: 0, applicable: 0 }
      };
    });
    var totals = { done: 0, not_done: 0, todo: 0, na: 0 };
    var byGroup = { nonneg: { done: 0, applicable: 0 }, other: { done: 0, applicable: 0 } };
    var byTaskId = {};

    s.tasks.forEach(function (task) {
      var ci = idxById[task.categoryId];
      if (ci === undefined) return; // archived-category tasks are left out
      var ts = byTaskId[task.id] = { done: 0, applicable: 0 };
      var createdKey = localDateKey(new Date(task.createdAt));
      var iterStart = createdKey > startKey ? createdKey : startKey;
      if (iterStart > end) return;
      var group = task.nonNegotiable ? "nonneg" : "other";
      var cursor = parseDateKey(iterStart);
      while (localDateKey(cursor) <= end) {
        var b = taskDayBucket(s, task, localDateKey(cursor), todayKey);
        if (b) {
          totals[b]++;
          byCat[ci][b]++;
          if (b !== "na") {
            byGroup[group].applicable++;
            byCat[ci][group].applicable++;
            ts.applicable++;
            if (b === "done") { byGroup[group].done++; byCat[ci][group].done++; ts.done++; }
          }
        }
        cursor = addDays(cursor, 1);
      }
    });

    var byCatId = {};
    byCat.forEach(function (c) {
      c.applicable = c.done + c.not_done + c.todo;
      c.pct = weightedPct(c.nonneg, c.other);
      byCatId[c.id] = c;
    });
    var applicable = totals.done + totals.not_done + totals.todo;
    return {
      totals: totals, byCat: byCat, byCatId: byCatId, byGroup: byGroup, byTaskId: byTaskId,
      applicable: applicable, done: totals.done,
      pct: weightedPct(byGroup.nonneg, byGroup.other)
    };
  }

  // Current streak for one task: consecutive applicable days, counting back
  // from today, on which it was Done. Days it isn't applicable are skipped;
  // today only counts once it's been marked.
  function computeTaskStreak(s, task, todayKey) {
    var createdKey = localDateKey(new Date(task.createdAt));
    var statuses = s.statusesByTask[task.id] || {};
    var streak = 0;
    var cursor = parseDateKey(todayKey);
    while (localDateKey(cursor) >= createdKey) {
      var dk = localDateKey(cursor);
      if (isTaskApplicableOn(task, dk, todayKey)) {
        var st = statuses[dk];
        if (st === "done") streak++;
        else if (dk !== todayKey || st === "not_done") break;
      }
      cursor = addDays(cursor, -1);
    }
    return streak;
  }

  // ---------- discipline levels ----------
  //
  // Added at the user's explicit request — a deliberate exception to
  // PRODUCT.md's "no points, badges, levels, or gamified rewards" non-goal
  // (see docs/ROADMAP.md, Post-launch revisions, for the conflict and the
  // decision to override it). A day counts as "disciplined" when its done %
  // — computeRangeStats' weighted `pct` (see weightedPct, above; the exact
  // same number the dash-summary headline now shows) — is at least
  // DISCIPLINE_THRESHOLD. The streak is whole-day and range-independent —
  // it always reads "now", same convention as every other streak in this
  // app (see PRODUCT.md, Dashboard: "Streaks are the only figures that
  // always read 'now', not the range").

  var DISCIPLINE_THRESHOLD = 80;

  // Consecutive disciplined days counting back from today, purely driven
  // by each day's done % — the moment today's live % crosses the
  // threshold it counts as today's day, with no separate "is everything
  // marked yet" gate. A day with nothing scheduled is skipped (neither
  // breaks nor extends the streak), same as computeTaskStreak skipping
  // inapplicable days. Today specifically never *breaks* the streak while
  // still under the threshold — it's not over yet, so a below-80% reading
  // right now just means "not counted yet," not "missed"; only a
  // genuinely past day below the threshold ends the streak. Bounded by the
  // app's own creation date so it can't loop forever through years with no
  // data.
  function computeDisciplineStreak(s, todayKey) {
    var floorKey = localDateKey(new Date(s.createdAt));
    var streak = 0;
    var cursor = parseDateKey(todayKey);
    while (localDateKey(cursor) >= floorKey) {
      var dk = localDateKey(cursor);
      var day = computeRangeStats(s, dk, dk, todayKey);
      if (!day.applicable) { cursor = addDays(cursor, -1); continue; }
      if (day.pct >= DISCIPLINE_THRESHOLD) { streak++; cursor = addDays(cursor, -1); continue; }
      if (dk === todayKey) { cursor = addDays(cursor, -1); continue; }
      break;
    }
    return streak;
  }

  // Five tiers, named/iconed around discipline rather than points — `days`
  // is the streak length at which that tier is reached (Beginner is the
  // starting tier, not a real milestone). Icons are built lazily
  // (functions, not elements) since the same level set is reused by both
  // the badge and the track's five stops.
  // Simple, bold, convex shapes on purpose — a 15px icon has no room for
  // curved detail (the first pass used a flame/shield/crown built from
  // hand-drawn curves and they read as indistinct blobs at this size, per
  // user feedback). A dot, a hexagonal shield, a bolt and a star are each
  // recognizable from their silhouette alone.
  var DISCIPLINE_LEVELS = [
    { name: "Beginner", days: 0, icon: function () { return svgIcon([h("circle", { cx: 12, cy: 12, r: 4, fill: "currentColor", stroke: "none" })]); } },
    { name: "Committed", days: 30, icon: function () {
      return svgIcon([h("polyline", { points: "4 13 9 18 20 5", fill: "none", stroke: "currentColor", "stroke-width": "3.2", "stroke-linecap": "round", "stroke-linejoin": "round" })]);
    } },
    { name: "Disciplined", days: 90, icon: function () {
      return svgIcon([h("polygon", { points: "12 2 20 6 20 13 12 22 4 13 4 6", fill: "currentColor", stroke: "none" })]);
    } },
    { name: "Relentless", days: 180, icon: function () {
      return svgIcon([h("polygon", { points: "13 2 3 14 12 14 11 22 21 10 12 10", fill: "currentColor", stroke: "none" })]);
    } },
    { name: "Unbreakable", days: 365, icon: function () {
      return svgIcon([h("polygon", { points: "12 2 14.35 8.76 21.51 8.91 15.8 13.24 17.88 20.09 12 16 6.12 20.09 8.2 13.24 2.49 8.91 9.65 8.76", fill: "currentColor", stroke: "none" })]);
    } }
  ];

  // Current level index, next level (or null at the top), progress through
  // the current segment (0-1), and the overall fraction across all
  // segments (for the track's fill width) — levelIdx..levelIdx+1 is one
  // segment out of DISCIPLINE_LEVELS.length-1 equal-width segments, so an
  // early (30-day) segment reads just as prominently as the last (365-day)
  // one instead of being crushed by the real day-count scale.
  function disciplineProgress(streakDays) {
    var levels = DISCIPLINE_LEVELS;
    var segCount = levels.length - 1;
    var levelIdx = 0;
    for (var i = 0; i < levels.length; i++) { if (streakDays >= levels[i].days) levelIdx = i; }
    var atMax = levelIdx === levels.length - 1;
    var nextIdx = atMax ? null : levelIdx + 1;
    var segFrac = atMax ? 1 : Math.min(1, Math.max(0,
      (streakDays - levels[levelIdx].days) / (levels[nextIdx].days - levels[levelIdx].days)));
    var overallFrac = atMax ? 1 : (levelIdx + segFrac) / segCount;
    return { levelIdx: levelIdx, nextIdx: nextIdx, segFrac: segFrac, overallFrac: overallFrac };
  }

  // ---------- day plan cards ----------

  var PLAN_COLUMNS = [
    { key: "workday", label: "Working days" },
    { key: "weekend", label: "Weekend" }
  ];

  // Two plans share the same two-column card layout: "day" (Day Plan, the
  // personal routine) and "business" (Business — business tasks sorted
  // into working days / weekend).
  function planCardsInColumn(s, plan, column) {
    return s.planCards.filter(function (c) { return c.plan === plan && c.column === column; }).sort(function (a, b) { return a.order - b.order; });
  }

  function addPlanCard(s, plan, column, name, color, startTime, endTime) {
    var siblings = planCardsInColumn(s, plan, column);
    var card = { id: uid("pln"), plan: plan, column: column, name: name, color: color, startTime: startTime, endTime: endTime,
                 order: siblings.length ? siblings[siblings.length - 1].order + 1 : 0 };
    s.planCards.push(card);
    saveState(s);
    return card;
  }

  function updatePlanCardField(s, id, field, value) {
    var c = s.planCards.find(function (x) { return x.id === id; });
    if (!c) return;
    c[field] = value;
    saveState(s);
  }

  function removePlanCard(s, id) {
    s.planCards = s.planCards.filter(function (c) { return c.id !== id; });
    saveState(s);
  }

  // `ids` is one list's record ids (plan cards of a column, gym blocks of a
  // day) in their new top-to-bottom order; `records` is the array they're in.
  function reorderByIds(s, records, ids) {
    ids.forEach(function (id, i) {
      var r = records.find(function (x) { return x.id === id; });
      if (r) r.order = i;
    });
    saveState(s);
  }

  // ---------- gym plan ----------

  var GYM_DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var GYM_DAY_ORDER = [1, 2, 3, 4, 5, 6, 0]; // Monday-first, like the rest of the app

  // The Gym plan's days always follow the Input Tracker task named
  // "Workout" (ignoring case and surrounding spaces) — the first active one
  // in an active category. null when there isn't one: every day is open.
  var GYM_TASK_NAME = "workout";

  function gymLinkedTask(s) {
    return s.tasks.find(function (t) {
      if (t.archived || (t.name || "").trim().toLowerCase() !== GYM_TASK_NAME) return false;
      var cat = s.categories.find(function (c) { return c.id === t.categoryId; });
      return cat && !cat.archived;
    }) || null;
  }

  function isGymDay(s, dow) {
    var t = gymLinkedTask(s);
    return !t || t.scheduledDays.indexOf(dow) !== -1;
  }

  function gymBlocksOnDay(s, dow) {
    return s.gymBlocks.filter(function (b) { return b.dayOfWeek === dow; }).sort(function (a, b) { return a.order - b.order; });
  }

  function addGymBlock(s, dow, exercise, note) {
    var siblings = gymBlocksOnDay(s, dow);
    var block = { id: uid("gym"), dayOfWeek: dow, exercise: exercise, note: note,
                  order: siblings.length ? siblings[siblings.length - 1].order + 1 : 0 };
    s.gymBlocks.push(block);
    saveState(s);
    return block;
  }

  function updateGymBlockField(s, id, field, value) {
    var b = s.gymBlocks.find(function (x) { return x.id === id; });
    if (!b) return;
    b[field] = value;
    saveState(s);
  }

  function removeGymBlock(s, id) {
    s.gymBlocks = s.gymBlocks.filter(function (b) { return b.id !== id; });
    saveState(s);
  }

  // One-time migration from the old weekly Calendar: Mon–Fri blocks become
  // "workday" cards, Sat/Sun ones "weekend", in start-time order. A block
  // repeated across several days (same name, same column) becomes one card.
  function blocksToPlanCards(blocks) {
    var seen = {}, next = { workday: 0, weekend: 0 }, cards = [];
    blocks.slice().sort(function (a, b) { return clockToMinutes(a.startTime) - clockToMinutes(b.startTime); }).forEach(function (b) {
      var column = b.dayOfWeek === 0 || b.dayOfWeek === 6 ? "weekend" : "workday";
      var name = b.label || "Untitled";
      var key = column + "|" + name.toLowerCase();
      if (seen[key]) return;
      seen[key] = true;
      cards.push({ id: uid("pln"), column: column, name: name, color: b.color || "#3a7ca5",
                   startTime: b.startTime || "09:00", endTime: b.endTime || "10:00", order: next[column]++ });
    });
    return cards;
  }

  // "HH:MM" (24h) <-> minutes since midnight. minutesToClock wraps past
  // midnight, so 25:00 becomes "01:00".
  function clockToMinutes(t) { var p = String(t || "0:0").split(":").map(Number); return p[0] * 60 + p[1]; }
  function minutesToClock(total) {
    total = ((total % 1440) + 1440) % 1440;
    return String(Math.floor(total / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
  }

  // Minutes from start to end; an end at or before the start is read as
  // running past midnight (e.g. sleep 23:00 → 07:00 = 8h).
  function planCardDuration(card) {
    var d = clockToMinutes(card.endTime) - clockToMinutes(card.startTime);
    return d > 0 ? d : d + 1440;
  }

  function formatDuration(min) {
    var hrs = Math.floor(min / 60), m = min % 60;
    if (!hrs) return m + "m";
    return m ? hrs + "h " + m + "m" : hrs + "h";
  }

  // ---------- projects ----------

  var PROJECT_AREAS = [
    { key: "job", label: "Job" },
    { key: "business", label: "Business" }
  ];

  function projectsInArea(s, area) {
    return s.projects.filter(function (p) { return p.area === area; }).sort(function (a, b) { return a.order - b.order; });
  }

  function addProject(s, area, name, color, deadline) {
    var siblings = projectsInArea(s, area);
    var project = { id: uid("prj"), area: area, name: name, color: color, deadline: deadline || null,
                    order: siblings.length ? siblings[siblings.length - 1].order + 1 : 0, createdAt: nowIso() };
    s.projects.push(project);
    saveState(s);
    return project;
  }

  function updateProjectField(s, id, field, value) {
    var p = s.projects.find(function (x) { return x.id === id; });
    if (!p) return;
    p[field] = value;
    if (field === "area") {
      var others = projectsInArea(s, value).filter(function (x) { return x.id !== id; });
      p.order = others.length ? others[others.length - 1].order + 1 : 0;
    }
    saveState(s);
  }

  // Deleting a project deletes its tasks with it.
  function removeProject(s, id) {
    s.projects = s.projects.filter(function (p) { return p.id !== id; });
    s.projectTasks = s.projectTasks.filter(function (t) { return t.projectId !== id; });
    saveState(s);
  }

  var TASK_STATUSES = [
    { key: "todo", label: "To Do" },
    { key: "doing", label: "In Progress" },
    { key: "done", label: "Done" }
  ];

  // A project's tasks, optionally only one status column, in board order.
  function projectTasksOf(s, projectId, status) {
    return s.projectTasks.filter(function (t) { return t.projectId === projectId && (!status || t.status === status); })
      .sort(function (a, b) { return a.order - b.order; });
  }

  // New tasks land at the bottom of To Do.
  function addProjectTask(s, projectId, title) {
    var siblings = projectTasksOf(s, projectId, "todo");
    s.projectTasks.push({ id: uid("ptk"), projectId: projectId, title: title, status: "todo", doneAt: null,
                          order: siblings.length ? siblings[siblings.length - 1].order + 1 : 0 });
    saveState(s);
  }

  // Puts a task in `status` and renumbers that column to `orderedIds` (the
  // column's ids top to bottom, this task included). doneAt is stamped on
  // entering Done and cleared on leaving it.
  function moveProjectTask(s, taskId, status, orderedIds) {
    var t = s.projectTasks.find(function (x) { return x.id === taskId; });
    if (!t) return;
    if (t.status !== status) t.doneAt = status === "done" ? nowIso() : null;
    t.status = status;
    orderedIds.forEach(function (id, i) {
      var x = s.projectTasks.find(function (y) { return y.id === id; });
      if (x) x.order = i;
    });
    saveState(s);
  }

  function renameProjectTask(s, id, title) {
    var t = s.projectTasks.find(function (x) { return x.id === id; });
    if (!t) return;
    t.title = title;
    saveState(s);
  }

  function removeProjectTask(s, id) {
    s.projectTasks = s.projectTasks.filter(function (t) { return t.id !== id; });
    saveState(s);
  }

  // A project's progress is its Done tasks over all its tasks; pct is null
  // while it has no tasks yet.
  function computeProjectProgress(s, project) {
    var tasks = projectTasksOf(s, project.id);
    var done = tasks.filter(function (t) { return t.status === "done"; }).length;
    var doing = tasks.filter(function (t) { return t.status === "doing"; }).length;
    return { done: done, doing: doing, total: tasks.length, pct: tasks.length ? Math.round((done / tasks.length) * 100) : null };
  }

  // ---------- learning ----------

  var LEARNING_KINDS = [
    { key: "course", label: "Course", color: "#3a7ca5", unit: "lessons" },
    { key: "book", label: "Book", color: "#c98a2e", unit: "chapters" },
    { key: "video", label: "Video", color: "#c0504d", unit: "videos" },
    { key: "article", label: "Article", color: "#3a8f7c", unit: "articles" },
    { key: "skill", label: "Skill", color: "#5b5fc7", unit: "exercises" },
    { key: "other", label: "Other", color: "#7a756e", unit: "parts" }
  ];
  var LEARNING_STATUSES = [
    { key: "active", label: "Learning" },
    { key: "next", label: "Up next" },
    { key: "done", label: "Finished" }
  ];
  var LEARNING_MINUTES = [10, 15, 20, 25, 30, 45, 60, 75, 90, 120, 150, 180, 240];

  function learningKind(key) {
    return LEARNING_KINDS.find(function (k) { return k.key === key; }) || LEARNING_KINDS[LEARNING_KINDS.length - 1];
  }

  function learningItemsWithStatus(s, status) {
    return s.learningItems.filter(function (i) { return i.status === status; }).sort(function (a, b) { return a.order - b.order; });
  }

  function addLearningItem(s, fields) {
    var siblings = learningItemsWithStatus(s, fields.status);
    var item = {
      id: uid("lrn"), title: fields.title, kind: fields.kind, status: fields.status,
      unit: fields.unit, current: 0, total: fields.total || null, notes: "",
      order: siblings.length ? siblings[siblings.length - 1].order + 1 : 0,
      createdAt: nowIso(),
      startedAt: fields.status === "next" ? null : localDateKey(new Date()),
      finishedAt: fields.status === "done" ? localDateKey(new Date()) : null
    };
    s.learningItems.push(item);
    saveState(s);
    return item;
  }

  function updateLearningField(s, id, field, value) {
    var i = s.learningItems.find(function (x) { return x.id === id; });
    if (!i) return;
    i[field] = value;
    saveState(s);
  }

  // Moving between Learning / Up next / Finished stamps startedAt the first
  // time it's started and finishedAt when finished (cleared if reopened).
  function setLearningStatus(s, id, status) {
    var i = s.learningItems.find(function (x) { return x.id === id; });
    if (!i || i.status === status) return;
    var today = localDateKey(new Date());
    var others = learningItemsWithStatus(s, status);
    i.status = status;
    i.order = others.length ? others[others.length - 1].order + 1 : 0;
    if (status !== "next" && !i.startedAt) i.startedAt = today;
    i.finishedAt = status === "done" ? today : null;
    saveState(s);
  }

  // Steps progress by delta, clamped to 0..total (or just ≥ 0 with no total).
  function stepLearningProgress(s, id, delta) {
    var i = s.learningItems.find(function (x) { return x.id === id; });
    if (!i) return;
    var next = Math.max(0, (i.current || 0) + delta);
    if (i.total) next = Math.min(i.total, next);
    i.current = next;
    saveState(s);
  }

  // Deleting an item deletes its logged sessions with it.
  function removeLearningItem(s, id) {
    s.learningItems = s.learningItems.filter(function (i) { return i.id !== id; });
    s.learningSessions = s.learningSessions.filter(function (x) { return x.itemId !== id; });
    // its notes are kept, just no longer linked to anything
    s.learningNotes.forEach(function (n) { if (n.itemId === id) n.itemId = null; });
    saveState(s);
  }

  function addLearningSession(s, itemId, date, minutes, note) {
    s.learningSessions.push({ id: uid("lss"), itemId: itemId, date: date, minutes: minutes, note: note || "" });
    saveState(s);
  }

  function removeLearningSession(s, id) {
    s.learningSessions = s.learningSessions.filter(function (x) { return x.id !== id; });
    saveState(s);
  }

  // Sessions newest first; optionally only one item's.
  function learningSessionsOf(s, itemId) {
    return s.learningSessions.filter(function (x) { return !itemId || x.itemId === itemId; })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }

  function learningMinutes(s, itemId, startKey, endKey) {
    return learningSessionsOf(s, itemId).reduce(function (sum, x) {
      if (startKey && (x.date < startKey || x.date > endKey)) return sum;
      return sum + x.minutes;
    }, 0);
  }

  // Learning notes: a notebook, each note optionally tied to one item.
  function addLearningNote(s, title, body, itemId) {
    var note = { id: uid("lnt"), title: title, body: body, itemId: itemId || null, createdAt: nowIso(), updatedAt: nowIso() };
    s.learningNotes.push(note);
    saveState(s);
    return note;
  }

  function updateLearningNote(s, id, field, value) {
    var n = s.learningNotes.find(function (x) { return x.id === id; });
    if (!n) return;
    n[field] = value;
    n.updatedAt = nowIso();
    saveState(s);
  }

  function removeLearningNote(s, id) {
    s.learningNotes = s.learningNotes.filter(function (x) { return x.id !== id; });
    saveState(s);
  }

  // Most recently edited first.
  function learningNotesSorted(s) {
    return s.learningNotes.slice().sort(function (a, b) { return a.updatedAt < b.updatedAt ? 1 : a.updatedAt > b.updatedAt ? -1 : 0; });
  }

  // ---------- journal ----------
  //
  // One freeform entry per calendar day — a deliberate, documented
  // exception to PRODUCT.md's "no mood tracking or journaling" non-goal,
  // added at the user's explicit request after the conflict was flagged
  // and confirmed (same pattern as Discipline levels; see
  // docs/ROADMAP.md). Writing on a date with no entry yet creates one;
  // clearing the text back to empty removes it rather than leaving a
  // blank record behind.

  function journalEntryForDate(s, dateKey) {
    return s.journalEntries.find(function (e) { return e.date === dateKey; }) || null;
  }

  function setJournalEntry(s, dateKey, body) {
    var existing = journalEntryForDate(s, dateKey);
    if (!body.trim()) {
      if (existing) s.journalEntries = s.journalEntries.filter(function (e) { return e.id !== existing.id; });
      saveState(s);
      return;
    }
    if (existing) {
      existing.body = body;
      existing.updatedAt = nowIso();
    } else {
      s.journalEntries.push({ id: uid("jrn"), date: dateKey, body: body, createdAt: nowIso(), updatedAt: nowIso() });
    }
    saveState(s);
  }

  // Most recent date first, for the browse list.
  function journalEntriesSorted(s) {
    return s.journalEntries.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }

  // ---------- goals ----------

  function activeGoalsByHorizon(s, horizon) {
    return s.goals.filter(function (g) { return !g.archived && g.horizon === horizon; }).sort(function (a, b) { return a.order - b.order; });
  }

  // opts (all optional): { name, deadline, parentGoalId, linkedTaskIds,
  // linkType, countTarget }. The horizon is passed separately — it's chosen
  // in the "New goal" popup and decides which section the new card lands in.
  function addGoal(s, horizon, opts) {
    opts = opts || {};
    var siblings = s.goals.filter(function (g) { return g.horizon === horizon; });
    var maxOrder = siblings.reduce(function (m, g) { return Math.max(m, g.order); }, -1);
    var goal = {
      id: uid("gol"), name: opts.name || "", horizon: horizon,
      deadline: opts.deadline || null, percent: 0,
      parentGoalId: opts.parentGoalId || null,
      linkedTaskIds: opts.linkedTaskIds || [],
      linkType: opts.linkType || null,          // null (manual) | "rate" | "count"
      countTarget: opts.countTarget || null,    // number, only for linkType "count"
      order: maxOrder + 1, archived: false, createdAt: nowIso(), updatedAt: nowIso()
    };
    s.goals.push(goal);
    saveState(s);
    return goal;
  }

  function updateGoalField(s, id, field, value) {
    var g = s.goals.find(function (x) { return x.id === id; });
    if (!g) return;
    g[field] = value;
    g.updatedAt = nowIso();
    saveState(s);
  }

  function archiveGoal(s, id) {
    var g = s.goals.find(function (x) { return x.id === id; });
    if (!g) return;
    g.archived = true;
    saveState(s);
  }

  // The horizon a goal can ladder up into (short -> mid -> long). Long has
  // nothing above it. Drives both the parent picker and the roll-up.
  var PARENT_HORIZON = { short: "mid", mid: "long" };

  // Total all-time count of "done" entries stored for a task.
  function countDoneEntries(s, taskId) {
    var m = s.statusesByTask[taskId];
    if (!m) return 0;
    var n = 0;
    for (var k in m) if (Object.prototype.hasOwnProperty.call(m, k) && m[k] === "done") n++;
    return n;
  }

  // A goal's live progress, derived rather than stored:
  //  - short-term with linkType + linked tasks -> "rate" (avg of each
  //    linked task's accomplishment %) or "count" (Σ done entries / target).
  //  - mid/long with linked child goals -> average of their live progress.
  //  - otherwise -> the manual `percent` value.
  // Returns { pct, source: "linked" | "rollup" | "manual" }. `seen` guards
  // against a hand-edited parent cycle.
  function goalEffectiveProgress(goal, seen) {
    seen = seen || {};
    if (seen[goal.id]) return { pct: goal.percent || 0, source: "manual" };
    seen[goal.id] = true;

    if (goal.horizon === "short") {
      var tasks = (goal.linkedTaskIds || [])
        .map(function (id) { return state.tasks.find(function (t) { return t.id === id; }); })
        .filter(function (t) { return t && !t.archived; });
      if (goal.linkType && tasks.length) {
        if (goal.linkType === "rate") {
          var todayKey = localDateKey(new Date());
          var vals = tasks.map(function (t) {
            var acc = computeTaskAccomplishment(state, t, todayKey);
            return acc ? acc.pct : 0;
          });
          var avg = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
          return { pct: Math.round(avg), source: "linked" };
        }
        if (goal.linkType === "count" && goal.countTarget > 0) {
          var total = tasks.reduce(function (sum, t) { return sum + countDoneEntries(state, t.id); }, 0);
          return { pct: Math.min(100, Math.round((total / goal.countTarget) * 100)), source: "linked" };
        }
      }
      return { pct: goal.percent || 0, source: "manual" };
    }

    // mid / long: roll up from child goals that ladder into this one
    var children = state.goals.filter(function (g) { return !g.archived && g.parentGoalId === goal.id; });
    if (children.length) {
      var sum = children.reduce(function (acc, c) { return acc + goalEffectiveProgress(c, seen).pct; }, 0);
      return { pct: Math.round(sum / children.length), source: "rollup" };
    }
    return { pct: goal.percent || 0, source: "manual" };
  }

  // Overdue: a deadline in the past with the goal not yet at 100% (by its
  // live progress). `pct` may be passed in when the caller already has it.
  function isGoalOverdue(goal, pct) {
    if (!goal.deadline) return false;
    if (goal.deadline >= localDateKey(new Date())) return false;
    if (pct == null) pct = goalEffectiveProgress(goal).pct;
    return pct < 100;
  }

  // ---------- identity ----------

  function updateIdentityText(s, text) {
    s.identityStatement = text;
    saveState(s);
  }

  // ---------- finance ----------

  // Money is always stored as an integer count of cents — never a float —
  // so repeated additions (summing an expense log, accumulating payments)
  // can't drift from floating-point rounding. No currency symbol is forced
  // anywhere in the UI; amounts are shown as plain formatted numbers.
  function parseAmountToCents(str) {
    if (typeof str !== "string") return null;
    str = str.trim().replace(/,/g, "");
    if (!str) return null;
    var n = Number(str);
    if (!isFinite(n) || n < 0) return null;
    return Math.round(n * 100);
  }

  function formatCents(cents) {
    return ((cents || 0) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function sumCents(list, field) {
    return list.reduce(function (sum, x) { return sum + (x[field] || 0); }, 0);
  }

  // -- expenses: a simple dated log, nothing recurring or auto-generated --

  function addExpense(s, opts) {
    var e = {
      id: uid("exp"), amountCents: opts.amountCents, category: (opts.category || "").trim(),
      note: (opts.note || "").trim(), date: opts.date || localDateKey(new Date()), createdAt: nowIso()
    };
    s.expenses.push(e);
    saveState(s);
    return e;
  }

  function updateExpenseField(s, id, field, value) {
    var e = s.expenses.find(function (x) { return x.id === id; });
    if (!e) return;
    e[field] = value;
    saveState(s);
  }

  function removeExpense(s, id) {
    var i = s.expenses.findIndex(function (x) { return x.id === id; });
    if (i !== -1) { s.expenses.splice(i, 1); saveState(s); }
  }

  // Every distinct category typed so far, for the create/edit form's
  // suggestion list — category stays free text, no fixed enum stored.
  function knownExpenseCategories(s) {
    var seen = {};
    s.expenses.forEach(function (e) { if (e.category) seen[e.category] = true; });
    return Object.keys(seen).sort();
  }

  function expensesThisMonth(s) {
    var prefix = localDateKey(new Date()).slice(0, 7); // "YYYY-MM"
    return s.expenses.filter(function (e) { return (e.date || "").indexOf(prefix) === 0; });
  }

  // -- debts: a balance that payments bring down, plus the payment log --

  function addDebt(s, opts) {
    var d = {
      id: uid("debt"), name: (opts.name || "").trim(),
      principalCents: opts.principalCents, balanceCents: opts.principalCents,
      interestRate: opts.interestRate != null ? opts.interestRate : null,
      createdAt: nowIso()
    };
    s.debts.push(d);
    saveState(s);
    return d;
  }

  function updateDebtField(s, id, field, value) {
    var d = s.debts.find(function (x) { return x.id === id; });
    if (!d) return;
    d[field] = value;
    saveState(s);
  }

  function removeDebt(s, id) {
    var i = s.debts.findIndex(function (x) { return x.id === id; });
    if (i !== -1) s.debts.splice(i, 1);
    s.debtPayments = s.debtPayments.filter(function (p) { return p.debtId !== id; });
    saveState(s);
  }

  // Logging a payment both records it (for history/total-paid) and brings
  // the debt's own balance down — the two always move together.
  function logDebtPayment(s, debtId, amountCents, date, note) {
    var d = s.debts.find(function (x) { return x.id === debtId; });
    if (!d) return;
    d.balanceCents = Math.max(0, (d.balanceCents || 0) - amountCents);
    s.debtPayments.push({
      id: uid("pmt"), debtId: debtId, amountCents: amountCents,
      date: date || localDateKey(new Date()), note: (note || "").trim(), createdAt: nowIso()
    });
    saveState(s);
  }

  function debtPaymentsOf(s, debtId) {
    return s.debtPayments.filter(function (p) { return p.debtId === debtId; })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }

  function totalPaidOnDebt(s, debtId) { return sumCents(debtPaymentsOf(s, debtId), "amountCents"); }

  // -- savings goals: a real target/current amount, not the abstract 0-100
  // slider the Goals tab uses — see docs/PRODUCT.md "Finance" for why both
  // exist side by side. --

  function addSavingsGoal(s, opts) {
    var g = {
      id: uid("sav"), name: (opts.name || "").trim(), targetCents: opts.targetCents,
      currentCents: opts.currentCents || 0, deadline: opts.deadline || null, createdAt: nowIso()
    };
    s.savingsGoals.push(g);
    saveState(s);
    return g;
  }

  function updateSavingsGoalField(s, id, field, value) {
    var g = s.savingsGoals.find(function (x) { return x.id === id; });
    if (!g) return;
    g[field] = value;
    saveState(s);
  }

  function addToSavingsGoal(s, id, deltaCents) {
    var g = s.savingsGoals.find(function (x) { return x.id === id; });
    if (!g) return;
    g.currentCents = Math.max(0, (g.currentCents || 0) + deltaCents);
    saveState(s);
  }

  function removeSavingsGoal(s, id) {
    var i = s.savingsGoals.findIndex(function (x) { return x.id === id; });
    if (i !== -1) { s.savingsGoals.splice(i, 1); saveState(s); }
  }

  // ---------- app ----------

  var SIDEBAR_KEY = "momentum:sidebarCollapsed";
  var ACTIVE_TAB_KEY = "momentum:activeTab";
  var VALID_TABS = ["dashboard", "calendar", "tracker", "projects", "learning", "finance", "journal", "goals"];
  var LEARNING_TAB_KEY = "momentum:learningTab"; // "active" | "next" | "done" — which tab inside Learning
  var PLANS_TAB_KEY = "momentum:plansTab"; // "day" | "business" | "gym" — which tab inside Plans
  var PROJECTS_TAB_KEY = "momentum:projectsTab"; // "job" | "business" — which tab inside Projects
  var FINANCE_TAB_KEY = "momentum:financeTab"; // "expenses" | "debts" | "savings" — which tab inside Finance
  var FINANCE_TABS = [
    { key: "expenses", label: "Expenses" },
    { key: "debts", label: "Debts" },
    { key: "savings", label: "Savings goals" }
  ];
  // Fixed expense category tags — "Other" (always appended where this list
  // is used) reveals a free-text field instead, so a category outside this

  var EXPENSE_CATEGORIES = ["Groceries", "Shopping", "Subscriptions", "Bills", "Transport", "Dining", "Health"];
  function isKnownExpenseCategory(cat) { return EXPENSE_CATEGORIES.indexOf(cat) !== -1; }

  var state = loadState();
  var appEl = document.getElementById("app");

  // Reopens on whatever tab was last active, not always Dashboard — a
  // per-device UI preference, so it's kept in its own localStorage key
  // rather than inside momentum:v2 (same reasoning as SIDEBAR_KEY below).
  var storedTab = localStorage.getItem(ACTIVE_TAB_KEY);
  var activeTab = VALID_TABS.indexOf(storedTab) !== -1 ? storedTab : "dashboard";

  var plansTab = ["business", "gym"].indexOf(localStorage.getItem(PLANS_TAB_KEY)) !== -1 ? localStorage.getItem(PLANS_TAB_KEY) : "day";

  var projectsTab = localStorage.getItem(PROJECTS_TAB_KEY) === "business" ? "business" : "job";

  var learningTab = ["next", "done", "notes"].indexOf(localStorage.getItem(LEARNING_TAB_KEY)) !== -1 ? localStorage.getItem(LEARNING_TAB_KEY) : "active";

  var financeTab = ["debts", "savings"].indexOf(localStorage.getItem(FINANCE_TAB_KEY)) !== -1 ? localStorage.getItem(FINANCE_TAB_KEY) : "expenses";

  function setActiveTab(tab) {
    activeTab = tab;
    localStorage.setItem(ACTIVE_TAB_KEY, tab);

  var sidebarCollapsed;
  var storedSidebarPref = localStorage.getItem(SIDEBAR_KEY);
  if (storedSidebarPref === "1") sidebarCollapsed = true;
  else if (storedSidebarPref === "0") sidebarCollapsed = false;
  else sidebarCollapsed = window.innerWidth < 880;

  // Theme: "auto" (default, follows the OS/browser's prefers-color-scheme —
  // see the CSS at the top of this file), or an explicit "light"/"dark"
  // override via a data-theme attribute on <html>, which the CSS also
  // defines. Cycled with one button in the sidebar footer.
  var THEME_KEY = "momentum:theme";
  var THEMES = ["auto", "light", "dark"];
  var theme = THEMES.indexOf(localStorage.getItem(THEME_KEY)) !== -1 ? localStorage.getItem(THEME_KEY) : "auto";

  function applyTheme(t) {
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }
  applyTheme(theme);

  function cycleTheme() {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    localStorage.setItem(THEME_KEY, theme);
    applyTheme(theme);
    render();
  }

  // Dashboard time filter — controls every Input-Tracker-derived element on
  // the Dashboard. Per-device UI state, so it lives in its own key like the
  // tab/sidebar/theme prefs, not inside momentum:v2. Defaults to "today".
  var DASH_FILTER_KEY = "momentum:dashFilter";
  var DASH_MODES = ["today", "week", "month", "year", "custom"];
  var dashFilter = { mode: "today", start: "", end: "" };
  try {
    var storedDF = JSON.parse(localStorage.getItem(DASH_FILTER_KEY) || "null");
    if (storedDF && DASH_MODES.indexOf(storedDF.mode) !== -1) {
      dashFilter = { mode: storedDF.mode, start: storedDF.start || "", end: storedDF.end || "" };
    }
  } catch (e) { /* corrupt pref — keep the default */ }
  var dashMenuOpen = false; // is the time-filter dropdown showing

  function saveDashFilter() { localStorage.setItem(DASH_FILTER_KEY, JSON.stringify(dashFilter)); }

  function setDashMode(mode) {
    dashFilter.mode = mode;
    if (mode === "custom" && (!dashFilter.start || !dashFilter.end)) {
      var t = localDateKey(new Date());
      if (!dashFilter.end) dashFilter.end = t;
      if (!dashFilter.start) dashFilter.start = localDateKey(getWeekInfo(new Date()).weekStart);
    }
    saveDashFilter();
    render();
  }

  // Resolve the current filter to concrete date keys. endKey is capped at
  // today for the fixed modes; a custom range is used as picked (the entry
  // iterator still clamps to today, so a future end just adds empty days).
  function dashRange() {
    var now = new Date();
    var todayKey = localDateKey(now);
    var f = dashFilter;
    if (f.mode === "week") {
      return { mode: f.mode, startKey: localDateKey(getWeekInfo(now).weekStart), endKey: todayKey, label: "This week" };
    }
    if (f.mode === "month") {
      return { mode: f.mode, startKey: localDateKey(new Date(now.getFullYear(), now.getMonth(), 1)), endKey: todayKey,
               label: now.toLocaleDateString(undefined, { month: "long", year: "numeric" }) };
    }
    if (f.mode === "year") {
      return { mode: f.mode, startKey: localDateKey(new Date(now.getFullYear(), 0, 1)), endKey: todayKey, label: String(now.getFullYear()) };
    }
    if (f.mode === "custom") {
      var a = f.start || todayKey, b = f.end || todayKey;
      if (a > b) { var tmp = a; a = b; b = tmp; }
      return { mode: f.mode, startKey: a, endKey: b, label: a + "  →  " + b };
    }
    return { mode: "today", startKey: todayKey, endKey: todayKey, label: "Today" };
  }

  var trackerWeekStart = null;   // Date (Sunday), lazily defaulted to the current week
  var editingCategoryId = null;  // which category's inline edit strip is open

  // ---------- backup export/import ----------
  //
  // CLAUDE.md rules out a real backend/database ("no backend, no network
  // calls of any kind") for protecting against lost browser data, so this
  // is the offline-compatible substitute: a full-state JSON file the user
  // downloads and keeps wherever they like (cloud drive, email, external
  // drive), and can later re-import to restore everything exactly as it
  // was. See docs/DATA-MODEL.md's "Export / import" section, which
  // specced this exact shape before it was built (added at the user's
  // explicit request — previously flagged there as "ask before pulling
  // forward"): the whole top-level object, serialized as-is, no wrapper.

  function exportBackup() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var link = h("a", { href: url, download: "momentum-export-" + localDateKey(new Date()) + ".json" });
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  // Validates the top-level shape looks right, then writes through
  // loadState()'s own tolerant-fixup migration rather than assigning the
  // parsed object directly, so an older backup still gets every
  // since-added field defaulted exactly like a normal page load would.
  // Destructive by design (a restore, not a merge) — confirmed first.
  function importBackupFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try {
        incoming = JSON.parse(reader.result);
        if (!incoming || !Array.isArray(incoming.categories) || !Array.isArray(incoming.tasks) ||
            typeof incoming.statusesByTask !== "object" || typeof incoming.settings !== "object") throw new Error("not a backup");
      } catch (e) {
        alert("Couldn't read that file as a Momentum backup.");
        return;
      }
      if (!confirm("Import this backup? It replaces everything currently in Momentum on this device.")) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(incoming));
      state = loadState();
      render();
    };
    reader.readAsText(file);
  }

    var shell = h("div", { class: "shell" });

    else if (activeTab === "projects") view = renderProjects();
    else if (activeTab === "learning") view = renderLearning();
    else if (activeTab === "finance") view = renderFinance();
    else if (activeTab === "journal") view = renderJournal();
    else view = renderTracker();
    main.appendChild(view);
    shell.appendChild(main);
    appEl.appendChild(shell);
    if (creatingExpense) {
      appEl.appendChild(renderExpenseCreateModal());
    } else if (editingExpenseId) {
      var editExpense = state.expenses.find(function (x) { return x.id === editingExpenseId; });

    } else if (creatingSavingsGoal) {

  // Every modal close routes through here: play the exit animation, then run
  // `commit` (which flips the open-state flag and re-renders, dropping the
  // modal from the DOM). Guarded so a second close during the animation just
  // finishes immediately.
  function closeModal(commit) {
    var ov = appEl.querySelector(".modal-overlay");
    if (!ov || ov.classList.contains("is-closing")) { commit(); return; }
    ov.classList.add("is-closing");
    var done = false;
    function finish() { if (done) return; done = true; commit(); }
    ov.addEventListener("animationend", finish);
    setTimeout(finish, 220); // fallback if animationend doesn't fire
  }

  // Phone-only masthead (hidden by CSS at wider widths, where the sidebar
  // already carries the brand and theme control): centered logo, theme
  // toggle at the right.
  function renderTopBar() {
    var themeIconFn = theme === "light" ? ICONS.themeLight : theme === "dark" ? ICONS.themeDark : ICONS.themeAuto;
    var themeLabel = theme === "light" ? "Light" : theme === "dark" ? "Dark" : "Auto";
    return h("header", { class: "topbar" }, [
      h("div", { class: "topbar-left" }),
      h("div", { class: "brand-lockup" }, [
        h("div", { class: "brand-mark", title: "Momentum" }, brandMark()),
        h("div", { class: "brand" }, "Momentum")
      ]),
      h("div", { class: "topbar-right" }, [
        h("button", { class: "topbar-icon-btn", title: "Export backup (JSON)", onclick: exportBackup }, ICONS.backupExport()),
        renderBackupImportControl("topbar-icon-btn"),
        h("button", { class: "topbar-icon-btn", title: "Export report (current Dashboard range)", onclick: function () { exportDashboardReport(dashRange(), localDateKey(new Date())); } }, ICONS.exportReport()),
        h("button", {
          class: "topbar-theme",
          title: "Theme: " + themeLabel + " (click to change)",
          onclick: cycleTheme
        }, [h("span", { class: "nav-icon" }, themeIconFn()), h("span", null, themeLabel)])
      ])
    ]);
  }

  // A hidden file input plus the button that triggers it — shared by the
  // sidebar footer (desktop/tablet) and the phone topbar so backup import
  // works at every breakpoint, same as the theme toggle already does.
  function renderBackupImportControl(btnClass) {
    var input = h("input", {
      type: "file", accept: "application/json", style: "display:none;",
      onchange: function (e) { var f = e.target.files[0]; if (f) importBackupFile(f); }
    });
    var btn = h("button", { class: btnClass, title: "Import backup (JSON)", onclick: function () { input.click(); } },
      btnClass === "topbar-icon-btn" ? ICONS.backupImport() : [h("span", { class: "nav-icon" }, ICONS.backupImport()), h("span", { class: "nav-label" }, "Import backup")]);
    return h("span", { class: "backup-import-control" }, [btn, input]);
  }

  // Shared day-of-week picker, currently only used for a task's scheduled
  // days (multi-select — onToggle flips one day in/out of the array).
  // onToggle mutates that array, so after it runs the button reflects the
  // new state in place — no full re-render needed.
  function renderDayPicker(activeDays, onToggle) {
    var row = h("div", { class: "day-row" });
    DAY_LABELS.forEach(function (label, idx) {
      var btn = h("button", {
        class: "day-btn" + (activeDays.indexOf(idx) !== -1 ? " active" : ""),
        onclick: function () { onToggle(idx); btn.classList.toggle("active", activeDays.indexOf(idx) !== -1); }
      }, label);
      row.appendChild(btn);
    });
    return row;
  }

  // ---------- Input Tracker ----------

  function renderTracker() {
    var root = h("div", { class: "view tracker" });
    var today = new Date();
    var todayKey = localDateKey(today);

    if (!trackerWeekStart) trackerWeekStart = getWeekInfo(today).weekStart;
    var weekStart = getWeekInfo(trackerWeekStart).weekStart;
    var weekEnd = addDays(weekStart, 6);
    var thisWeekStart = getWeekInfo(today).weekStart;
    var canGoNext = weekStart < thisWeekStart;

    root.appendChild(h("div", { class: "view-header" }, [
      h("h1", {}, "Input Tracker"),
      renderTrackerAddControl()
    ]));
    root.appendChild(h("p", { class: "hint" }, "Tap a day cell to cycle: To-Do → Done → Not Done → To-Do."));

    var toolbar = h("div", { class: "tracker-toolbar" });
    var prevAttrs = { class: "week-nav-btn", onclick: function () { trackerWeekStart = addDays(weekStart, -7); render(); } };
    var nextAttrs = { class: "week-nav-btn" };
    if (canGoNext) nextAttrs.onclick = function () { trackerWeekStart = addDays(weekStart, 7); render(); };
    else nextAttrs.disabled = true;
    toolbar.appendChild(h("div", { class: "week-nav" }, [
      h("button", prevAttrs, "‹"),
      h("div", { class: "week-nav-label" }, formatWeekRange(weekStart, weekEnd)),
      h("button", nextAttrs, "›")
    ]));

    root.appendChild(toolbar);

    var categories = activeCategories(state);
    if (categories.length === 0) {
      root.appendChild(h("p", { class: "hint" }, "No categories yet — use ＋ New to add one."));
    } else {
      var weekDates = [];
      for (var i = 0; i < 7; i++) weekDates.push(addDays(weekStart, i));
      var daysBar = renderTrackerDaysBar(weekDates, todayKey);
      var cards = h("div", { class: "tracker-cards" });
      categories.forEach(function (cat) {
        cards.appendChild(renderCategoryCard(cat, weekDates, todayKey));
      });
      // On narrow screens the cards scroll sideways together; the pinned
      // days bar follows along so its columns stay over the cells.
      cards.addEventListener("scroll", function () { daysBar.firstChild.scrollLeft = cards.scrollLeft; });
      root.appendChild(daysBar);
      root.appendChild(cards);
    }

    return root;
  }

  // The single "＋ New" control at the top-right of Input Tracker: one
  // button that drops a small menu (New task / New category); picking
  // either opens the matching create popup. "New task" is disabled until
  // there's a category to file it under.
  function renderTrackerAddControl() {
    var noCats = activeCategories(state).length === 0;
    var wrap = h("div", { class: "tracker-head-actions" + (trackerAddMenuOpen ? " open" : "") });
    wrap.appendChild(h("button", {
      class: "header-add-btn",
      "aria-haspopup": "true", "aria-expanded": trackerAddMenuOpen ? "true" : "false",
      onclick: function () { trackerAddMenuOpen = !trackerAddMenuOpen; render(); }
    }, "＋ New"));

    if (trackerAddMenuOpen) {
      wrap.appendChild(h("div", { class: "dash-menu-backdrop", onclick: function () { trackerAddMenuOpen = false; render(); } }));
      var menu = h("div", { class: "dash-menu", role: "menu" });
      menu.appendChild(h("button", {
        class: "dash-menu-item", disabled: noCats,
        title: noCats ? "Add a category first" : "",
        onclick: function () { trackerAddMenuOpen = false; creatingTask = true; render(); }
      }, "New task"));
      menu.appendChild(h("button", {
        class: "dash-menu-item",
        onclick: function () { trackerAddMenuOpen = false; creatingCategory = true; render(); }
      }, "New category"));
      wrap.appendChild(menu);
    }
    return wrap;
  }

  function renderTaskRow(task, category, weekDates, todayKey) {
    var row = h("tr", { class: "tt-task-row" });
    // The whole name is the edit control — clicking it opens the task popup.
    var nameCell = h("td", { class: "tt-task-name", style: "--cat-color:" + category.color + ";" },
      h("button", { class: "tt-task-btn", title: "Edit task", onclick: function () { editingTaskId = task.id; render(); } }, [
        task.nonNegotiable ? h("span", { class: "tt-nn-mark", title: "Non-negotiable" }, "⭐") : null,
        task.name || "(unnamed task)"
      ]));
    row.appendChild(nameCell);

    // Cells update themselves (and this row's % cell) on tap rather than
    // triggering a full-table render() — the whole table rebuilding on every
    // status tap flashed and blocked the CSS colour transition.
    var pctCell = h("td", { class: "tt-pct-cell" });
    function paintPct() {
      var acc = computeTaskWeekAccomplishment(state, task, weekDates, todayKey);
      pctCell.textContent = acc ? acc.pct + "%" : "—";
      pctCell.title = acc
        ? acc.done + " of " + acc.scheduled + " scheduled days this week done"
        : "Not scheduled on any day this week";
    }

    weekDates.forEach(function (d) {
      var dk = localDateKey(d);
      var cell = h("td", {});
      function paintCell() {
        var status = derivedTaskStatus(state, task, dk);
        var future = dk > todayKey;
        var dayOver = dk < todayKey;
        var display = (status === "todo" && dayOver) ? "not_done" : status;
        cell.className = "tt-cell status-" + (display === "todo" ? "pending" : display) + (future && status !== "na" ? " future" : "");
        cell.textContent = display === "done" ? "✓" : display === "not_done" ? "✕" : display === "na" ? "–" : "";
      }
      if (derivedTaskStatus(state, task, dk) !== "na" && dk <= todayKey) {
        cell.addEventListener("click", function () {
          cycleTaskStatus(state, task.id, dk);
          paintCell();
          paintPct();
        });
      }
      paintCell();
      row.appendChild(cell);
    });

    paintPct();
    row.appendChild(pctCell);

    return row;
  }

  // Same <colgroup> on the days bar and every category table — with
  // table-layout: fixed, that's what keeps their columns lined up.
  function trackerColgroup() {
    var cols = [h("col", { class: "tt-col-name" })];
    for (var i = 0; i < 7; i++) cols.push(h("col"));
    cols.push(h("col", { class: "tt-col-pct" }));
    return h("colgroup", {}, cols);
  }

  // The week's day headings, shown once above all the category cards and
  // pinned to the top of the screen while scrolling down.
  function renderTrackerDaysBar(weekDates, todayKey) {
    var headRow = h("tr");
    headRow.appendChild(h("th", { class: "tt-corner" }, "Task"));
    weekDates.forEach(function (d) {
      headRow.appendChild(h("th", {
        class: "tt-day-head" + (localDateKey(d) === todayKey ? " tt-today" : "")
      }, [DAY_LABELS[d.getDay()], h("span", { class: "tt-day-date" }, formatShortDate(d))]));
    });
    headRow.appendChild(h("th", { class: "tt-pct-head", title: "Done this week ÷ days scheduled this week" }, "Week %"));
    var table = h("table", { class: "tracker-table tt-days-table" }, [trackerColgroup(), h("thead", {}, headRow)]);
    return h("div", { class: "tracker-days" }, h("div", { class: "tracker-days-scroll" }, table));
  }

  // One separate card per category: a title strip (name in its colour,
  // task count, ✎ Edit) over its own table of task rows. The day headings
  // live once in the pinned days bar above all the cards.
  function renderCategoryCard(cat, weekDates, todayKey) {
    var tasks = activeTasksInCategory(state, cat.id);
    var table = h("table", { class: "tracker-table" }, trackerColgroup());

    var tbody = h("tbody");
    if (editingCategoryId === cat.id) tbody.appendChild(renderCategoryEditStrip(cat));
    tasks.forEach(function (task) { tbody.appendChild(renderTaskRow(task, cat, weekDates, todayKey)); });
    if (!tasks.length) tbody.appendChild(h("tr", { class: "tt-empty-row" }, h("td", { colspan: "9" }, "No tasks yet — use ＋ New → New task.")));
    table.appendChild(tbody);

    return h("section", { class: "tracker-wrap tracker-card", style: "--cat-color:" + cat.color + ";" }, [
      h("div", { class: "tt-card-head" }, h("div", { class: "tt-card-head-label" }, [
        h("span", { class: "tt-cat-name" }, cat.name || "(unnamed category)"),
        h("span", { class: "tt-cat-count" }, tasks.length + (tasks.length === 1 ? " task" : " tasks")),
        h("button", { class: "icon-btn", onclick: function () { editingCategoryId = editingCategoryId === cat.id ? null : cat.id; render(); } }, "✎ Edit")
      ])),
      table
    ]);
  }

  function renderCategoryEditStrip(cat) {
    var row = h("tr", { class: "tt-edit-row" });
    var form = h("div", { class: "tt-edit-form" });

    form.appendChild(h("div", { class: "tt-edit-form-row" }, [
      h("input", {
        type: "text", value: cat.name, placeholder: "Category name",
        oninput: function (e) { updateCategoryField(state, cat.id, "name", e.target.value); }
      })
    ]));

    // Swatches update in place (no full re-render, so the edit strip doesn't
    // flicker its entrance animation on every colour tap). The category
    // header row picks up the new colour on the next natural render — same
    // as the name field, which also doesn't live-update the header.
    var swatchRow = h("div", { class: "swatch-row" });
    var paletteBtns = [];
    CATEGORY_PALETTE.forEach(function (color) {
      var b = h("button", {
        class: "swatch" + (cat.color === color ? " active" : ""),
        style: "background:" + color + ";",
        onclick: function () {
          updateCategoryField(state, cat.id, "color", color);
          paletteBtns.forEach(function (pb, i) { pb.classList.toggle("active", CATEGORY_PALETTE[i] === color); });
        }
      });
      paletteBtns.push(b);
      swatchRow.appendChild(b);
    });
    swatchRow.appendChild(h("input", {
      type: "color", class: "swatch-custom", value: cat.color,
      oninput: function (e) {
        updateCategoryField(state, cat.id, "color", e.target.value);
        paletteBtns.forEach(function (pb) { pb.classList.remove("active"); });
      }
    }));
    form.appendChild(swatchRow);

    form.appendChild(h("div", { class: "tt-edit-form-row" }, [
      h("button", { class: "icon-btn", onclick: function () { archiveCategory(state, cat.id); editingCategoryId = null; render(); } }, "Archive category"),
      h("button", { class: "icon-btn", onclick: function () { editingCategoryId = null; render(); } }, "Done")
    ]));

    row.appendChild(h("td", { colspan: "9" }, form));
    return row;
  }

  // A non-negotiable toggle chip (used by both task popups). `getState` /
  // `onFlip` keep it working against either a live task field or a draft.
  function taskNonNegChip(initial, onFlip) {
    var on = initial;
    var chip = h("button", {
      class: "mode-btn" + (on ? " active" : ""),
      title: "Show this task in the Dashboard's Non-negotiable group",
      onclick: function () {
        on = !on;
        onFlip(on);
        chip.classList.toggle("active", on);
        chip.textContent = on ? "⭐ Non-negotiable" : "☆ Mark as non-negotiable";
      }
    }, on ? "⭐ Non-negotiable" : "☆ Mark as non-negotiable");
    return chip;
  }

  // The Input Tracker "＋ New → New task" menu item opens this. Draft
  // values (including which category to file under) live only in this
  // closure until "＋ Add task" is pressed — Cancel / ✕ / backdrop /
  // Escape close without creating anything.
  function renderTaskCreateModal() {
    var cats = activeCategories(state);
    var draft = { catId: cats.length ? cats[0].id : null, days: [0, 1, 2, 3, 4, 5, 6], nonNegotiable: false };
    function close() { closeModal(function () { creatingTask = false; render(); }); }

    function catColor(id) {
      var c = cats.find(function (x) { return x.id === id; });
      return c ? c.color : "var(--target)";
    }

    var nameInput = h("input", { type: "text", placeholder: "Task name" });

    var catSelect = h("select", {
      onchange: function (e) { draft.catId = e.target.value; dialog.style.setProperty("--hz-color", catColor(draft.catId)); }
    });
    cats.forEach(function (c) {
      catSelect.appendChild(h("option", { value: c.id, selected: c.id === draft.catId }, c.name || "(unnamed category)"));
    });

    function toggleDraftDay(idx) {
      var i = draft.days.indexOf(idx);
      if (i === -1) draft.days.push(idx);
      else if (draft.days.length > 1) draft.days.splice(i, 1);
      draft.days.sort(function (a, b) { return a - b; });
    }
    var nnChip = taskNonNegChip(false, function (on) { draft.nonNegotiable = on; });

    function submit() {
      var name = nameInput.value.trim();
      if (!name) { alert("Give the task a name first."); nameInput.focus(); return; }
      if (!draft.catId) { alert("Add a category first."); return; }
      var t = addTask(state, draft.catId);
      t.name = name;
      t.scheduledDays = draft.days.slice();
      t.nonNegotiable = draft.nonNegotiable;
      saveState(state);
      close();
    }

    var dialog = h("div", { class: "modal-dialog", style: "--hz-color:" + catColor(draft.catId) + ";" }, [
      h("div", { class: "modal-head" }, [
        h("div", { class: "modal-title" }, "Add task"),
        h("button", { class: "icon-btn", title: "Cancel", onclick: close }, "✕")
      ]),
      h("div", { class: "modal-body" }, [].concat(
        modalField("Category", catSelect),
        modalField("Name", nameInput),
        modalField("Scheduled days", renderDayPicker(draft.days, toggleDraftDay)),
        modalField("Grouping", nnChip)
      )),
      h("div", { class: "modal-actions" }, [
        h("button", { class: "secondary-btn", onclick: close }, "Cancel"),
        h("button", { class: "modal-primary", onclick: submit }, "＋ Add task")
      ])
    ]);

    var overlay = modalOverlay(dialog, close);
    setTimeout(function () { nameInput.focus(); }, 0);

  }

  // Clicking a task's name in Input Tracker opens this. Every field autosaves (like the
  // Day Plan card popup), so "Done" just closes; "Archive task" removes
  // it from the tracker.
  function renderTaskEditModal(task) {

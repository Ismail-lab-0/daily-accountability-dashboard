  // ---------- Dashboard ----------

  // Every active task, split by its nonNegotiable flag and sorted by
  // category then order. NOT filtered to "scheduled today" here — the
  // "Today" view filters to today's tasks in renderDashTaskCard, while the
  // wider ranges (Week/Month/…) list every task with its % for the range.
  function todaysTasksSplit(todayKey) {
    var catOrder = {};
    state.categories.forEach(function (c) { catOrder[c.id] = c.order; });
    var nonNegotiable = [], other = [];
    state.tasks.forEach(function (t) {
      if (t.archived) return;
      if (localDateKey(new Date(t.createdAt)) > todayKey) return; // not created yet
      (t.nonNegotiable ? nonNegotiable : other).push(t);
    });
    function byCategoryThenOrder(a, b) { return (catOrder[a.categoryId] - catOrder[b.categoryId]) || (a.order - b.order); }
    nonNegotiable.sort(byCategoryThenOrder);
    other.sort(byCategoryThenOrder);
    return { nonNegotiable: nonNegotiable, other: other };
  }

  // Marks / unmarks the task done for `todayKey` only — it's a per-day key
  // in statusesByTask, so tomorrow's Dashboard renders with a fresh (all
  // un-done) list without anything being reset explicitly.
  function toggleTodayTaskDone(taskId, todayKey, currentlyDone) {
    setTaskStatus(state, taskId, todayKey, currentlyDone ? null : "done");
    render();
  }

  // Today view of a task group: every task shown is scheduled today and is
  // one tap from done (tap again to undo). Tasks not scheduled today are
  // left off entirely (the caller pre-filters) — no greyed "not today" rows.
  function renderTodayTaskList(tasks, todayKey) {
    if (tasks.length === 0) return h("p", { class: "hint small" }, "Nothing scheduled today.");
    var list = h("div", { class: "today-task-list" });
    tasks.forEach(function (task) {
      var name = task.name || "(unnamed task)";
      var isDone = derivedTaskStatus(state, task, todayKey) === "done";
      list.appendChild(h("button", {
        class: "today-task-item" + (isDone ? " done" : ""),
        title: isDone ? "Done today — tap to undo" : "Tap to mark done for today",
        "aria-pressed": isDone ? "true" : "false",
        onclick: function () { toggleTodayTaskDone(task.id, todayKey, isDone); }
      }, [
        h("span", { class: "today-task-dot" }, isDone ? "✓" : ""),
        h("span", { class: "today-task-name" }, name)
      ]));
    });
    return list;
  }

  // Range view of a task group: one row per task with its % over the range.
  function renderRangeTaskList(tasks, stats) {
    if (tasks.length === 0) return h("p", { class: "hint small" }, "None yet.");
    var list = h("div", { class: "dash-range-list" });
    tasks.forEach(function (task) {
      var ts = stats.byTaskId[task.id] || { done: 0, applicable: 0 };
      var pct = ts.applicable ? Math.round((ts.done / ts.applicable) * 100) : null;
      list.appendChild(h("div", { class: "dash-range-task" }, [
        h("span", { class: "dash-range-task-name" }, task.name || "(unnamed task)"),
        h("span", { class: "dash-range-task-val" }, ts.applicable ? pct + "%  ·  " + ts.done + "/" + ts.applicable : "—")
      ]));
    });
    return list;
  }

  // --- Dashboard time filter ---

  var DASH_MODE_LABELS = { today: "Today", week: "This week", month: "This month", year: "This year", custom: "Custom range" };
  var DASH_MODE_OPTIONS = [["today", "Today"], ["week", "Week"], ["month", "Month"], ["year", "Year"], ["custom", "Custom range"]];

  function renderDashFilter(range) {
    var bar = h("div", { class: "dash-filter" });

    var wrap = h("div", { class: "dash-filter-wrap" + (dashMenuOpen ? " open" : "") });
    wrap.appendChild(h("button", {
      class: "dash-filter-trigger",
      "aria-haspopup": "true", "aria-expanded": dashMenuOpen ? "true" : "false",
      onclick: function () { dashMenuOpen = !dashMenuOpen; render(); }
    }, [
      ICONS.calendar(),
      h("span", { class: "dash-filter-cur" }, DASH_MODE_LABELS[dashFilter.mode] || "Today"),
      h("span", { class: "dash-filter-chev" }, svgIcon([h("polyline", { points: "6 9 12 15 18 9" })]))
    ]));

    if (dashMenuOpen) {
      wrap.appendChild(h("div", { class: "dash-menu-backdrop", onclick: function () { dashMenuOpen = false; render(); } }));
      var menu = h("div", { class: "dash-menu", role: "menu" });
      DASH_MODE_OPTIONS.forEach(function (m) {
        menu.appendChild(h("button", {
          class: "dash-menu-item" + (dashFilter.mode === m[0] ? " active" : ""),
          role: "menuitem",
          onclick: function () { dashMenuOpen = false; setDashMode(m[0]); }
        }, m[1]));
      });
      wrap.appendChild(menu);
    }
    bar.appendChild(wrap);

    if (dashFilter.mode === "custom") {
      var maxKey = localDateKey(new Date());
      bar.appendChild(h("div", { class: "dash-custom" }, [
        h("input", {
          type: "date", value: dashFilter.start || range.startKey, max: maxKey,
          onchange: function (e) { dashFilter.start = e.target.value; saveDashFilter(); render(); }
        }),
        h("span", { class: "dash-custom-sep" }, "→"),
        h("input", {
          type: "date", value: dashFilter.end || range.endKey, max: maxKey,
          onchange: function (e) { dashFilter.end = e.target.value; saveDashFilter(); render(); }
        })
      ]));
    }
    return bar;
  }

  // ---------- report export ----------
  //
  // CLAUDE.md rules out any export/import built against a server, so this
  // reads the exact same range the Dashboard itself just computed and
  // writes it into a self-contained, printable HTML file opened in a new
  // tab (print-to-PDF ready) — no network call, no new dependency.
  // Previously flagged in docs/ROADMAP.md as "ask before pulling forward";
  // added at the user's explicit request.

  function reportEsc(str) {
    return String(str == null ? "" : str).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }

  function buildReportHtml(range, todayKey) {
    var stats = computeRangeStats(state, range.startKey, range.endKey, todayKey);
    var offTrack = computeOffTrack(state, todayKey);
    var end = range.endKey < todayKey ? range.endKey : todayKey;
    var sessions = state.learningSessions.filter(function (x) { return x.date >= range.startKey && x.date <= end; });
    var studyMinutes = sessions.reduce(function (sum, x) { return sum + x.minutes; }, 0);
    var expenses = state.expenses.filter(function (x) { return x.date >= range.startKey && x.date <= end; });
    var expenseTotal = sumCents(expenses, "amountCents");
    var journalEntries = journalEntriesSorted(state).filter(function (e) { return e.date >= range.startKey && e.date <= end; });

    var catRows = stats.byCat.map(function (c) {
      return "<tr><td>" + reportEsc(c.name || "(unnamed)") + "</td><td>" + (c.pct != null ? c.pct + "%" : "—") +
        "</td><td>" + c.done + " / " + c.applicable + "</td></tr>";
    }).join("");

    var journalHtml = journalEntries.length
      ? journalEntries.map(function (e) {
          var label = parseDateKey(e.date).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
          return "<div class=\"entry\"><h3>" + reportEsc(label) + "</h3><p>" + reportEsc(e.body).replace(/\n/g, "<br>") + "</p></div>";
        }).join("")
      : "<p class=\"muted\">No journal entries in this range.</p>";

    return "<!doctype html><html><head><meta charset=\"utf-8\"><title>Momentum report — " + reportEsc(range.label) + "</title><style>" +
      "body{font-family:-apple-system,Segoe UI,Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#222;}" +
      "h1{margin-bottom:2px;}.range{color:#666;margin-bottom:24px;}h2{margin-top:32px;border-bottom:1px solid #ddd;padding-bottom:6px;}" +
      "table{width:100%;border-collapse:collapse;margin-top:8px;}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid #eee;font-size:14px;}" +
      ".stat-row{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0;}.stat{min-width:140px;}.stat .num{font-size:22px;font-weight:700;}.stat .lbl{font-size:12px;color:#777;}" +
      ".entry{margin:14px 0;}.entry h3{font-size:14px;margin:0 0 4px;}.entry p{margin:0;white-space:pre-wrap;}.muted{color:#888;}" +
      "@media print{body{margin:0;padding:16px;}}" +
      "</style></head><body>" +
      "<h1>Momentum — " + reportEsc(range.label) + "</h1>" +
      "<div class=\"range\">" + reportEsc(range.startKey) + " to " + reportEsc(range.endKey) + " · generated " + reportEsc(new Date().toLocaleString()) + "</div>" +
      "<h2>Overview</h2><div class=\"stat-row\">" +
        "<div class=\"stat\"><div class=\"num\">" + (stats.applicable ? stats.pct + "%" : "—") + "</div><div class=\"lbl\">done (weighted)</div></div>" +
        "<div class=\"stat\"><div class=\"num\">" + stats.done + " / " + stats.applicable + "</div><div class=\"lbl\">scheduled task-entries</div></div>" +
        "<div class=\"stat\"><div class=\"num\">" + offTrack.length + "</div><div class=\"lbl\">tasks off track now</div></div>" +
      "</div>" +
      "<h2>By category</h2><table><tr><th>Category</th><th>Done %</th><th>Entries</th></tr>" + catRows + "</table>" +
      "<h2>Learning</h2><div class=\"stat-row\"><div class=\"stat\"><div class=\"num\">" + (studyMinutes ? formatDuration(studyMinutes) : "0m") +
        "</div><div class=\"lbl\">studied · " + sessions.length + " session" + (sessions.length === 1 ? "" : "s") + "</div></div></div>" +
      "<h2>Expenses</h2><div class=\"stat-row\"><div class=\"stat\"><div class=\"num\">" + formatCents(expenseTotal) +
        "</div><div class=\"lbl\">" + expenses.length + " expense" + (expenses.length === 1 ? "" : "s") + "</div></div></div>" +
      "<h2>Journal</h2>" + journalHtml +
      "</body></html>";
  }

  function exportDashboardReport(range, todayKey) {
    var blob = new Blob([buildReportHtml(range, todayKey)], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  // --- SVG donut ---

  function donutPolar(cx, cy, r, a) { return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; }
  function donutSlice(cx, cy, rO, rI, a0, a1) {
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    var p1 = donutPolar(cx, cy, rO, a0), p2 = donutPolar(cx, cy, rO, a1);
    var p3 = donutPolar(cx, cy, rI, a1), p4 = donutPolar(cx, cy, rI, a0);
    return "M" + p1[0] + " " + p1[1] +
      " A" + rO + " " + rO + " 0 " + large + " 1 " + p2[0] + " " + p2[1] +
      " L" + p3[0] + " " + p3[1] +
      " A" + rI + " " + rI + " 0 " + large + " 0 " + p4[0] + " " + p4[1] + " Z";
  }

  function renderDonut(parts, centerBig, centerSmall) {
    var total = parts.reduce(function (s, p) { return s + p.value; }, 0);
    var SZ = 180, cx = SZ / 2, cy = SZ / 2, rO = 80, rI = 50, rw = rO - rI;
    var svg = h("svg", { class: "donut", viewBox: "0 0 " + SZ + " " + SZ, role: "img" });
    if (total <= 0) {
      svg.appendChild(h("circle", { cx: cx, cy: cy, r: (rO + rI) / 2, style: "fill:none; stroke:var(--no-data); stroke-width:" + rw }));
    } else {
      var ang = 0;
      parts.forEach(function (p) {
        if (p.value <= 0) return;
        var frac = p.value / total;
        var a0 = ang, a1 = ang + frac * Math.PI * 2;
        ang = a1;
        if (frac > 0.999) {
          svg.appendChild(h("circle", { cx: cx, cy: cy, r: (rO + rI) / 2, style: "fill:none; stroke:" + p.color + "; stroke-width:" + rw }));
        } else {
          svg.appendChild(h("path", { d: donutSlice(cx, cy, rO, rI, a0, a1), style: "fill:" + p.color }));
        }
        if (frac >= 0.08) {
          var lp = donutPolar(cx, cy, (rO + rI) / 2, (a0 + a1) / 2);
          svg.appendChild(h("text", {
            x: lp[0], y: lp[1], "text-anchor": "middle", "dominant-baseline": "central",
            style: "font-size:12px; font-weight:700; fill:#fff; paint-order:stroke; stroke:rgba(0,0,0,0.32); stroke-width:3px;"
          }, Math.round(frac * 100) + "%"));
        }
      });
    }
    if (centerBig != null) {
      svg.appendChild(h("text", { x: cx, y: cy - 3, "text-anchor": "middle", "dominant-baseline": "central", class: "donut-center" }, String(centerBig)));
      if (centerSmall) svg.appendChild(h("text", { x: cx, y: cy + 15, "text-anchor": "middle", "dominant-baseline": "central", class: "donut-center-sub" }, centerSmall));
    }
    return svg;
  }

  // --- the two chart cards ---

  function renderEntryPieCard(stats) {
    // Denominator is every scheduled task-entry in the range (up to today),
    // not just the ones logged — so with nothing done the ring is 100%
    // "Not done", and it fills toward "Done" as habits get checked off.
    // "Not done" here folds in both explicit Not-Done marks and still-To-Do
    // entries; N/A days (task not scheduled) never count.
    var total = stats.applicable;
    var doneN = stats.done;
    var notDoneN = total - doneN;
    // The ring's proportions (and its in-wedge/center % labels, via
    // renderDonut) use weight-space — a non-negotiable entry counts double
    // — so they always match `stats.pct` in the center. `count` stays the
    // literal entry tally for the legend's "(N)", which intentionally
    // doesn't move with the weighting: it's reporting what happened, not
    // how much it counted for.
    var nonneg = stats.byGroup.nonneg, other = stats.byGroup.other;
    var totalWeight = nonneg.applicable * NON_NEGOTIABLE_WEIGHT + other.applicable;
    var doneWeight = nonneg.done * NON_NEGOTIABLE_WEIGHT + other.done;
    var parts = [
      { label: "Done", value: doneWeight, count: doneN, color: "var(--target)" },
      { label: "Not done", value: totalWeight - doneWeight, count: notDoneN, color: "var(--miss)" }
    ];
    var card = h("div", { class: "dash-card" });
    card.appendChild(h("div", { class: "dash-card-title" }, "Done vs not done — overall"));
    if (total === 0) {
      card.appendChild(h("p", { class: "hint small" }, "Nothing scheduled in this range."));
      return card;
    }
    var legend = h("div", { class: "dash-legend" });
    parts.forEach(function (p) {
      legend.appendChild(h("div", { class: "dash-legend-row" }, [
        h("span", { class: "dash-legend-sw", style: "background:" + p.color + ";" }),
        h("span", { class: "dash-legend-label" }, p.label),
        h("span", { class: "dash-legend-pct" }, (totalWeight ? Math.round((p.value / totalWeight) * 100) : 0) + "%"),
        h("span", { class: "dash-legend-count" }, "(" + p.count + ")")
      ]));
    });
    card.appendChild(h("div", { class: "dash-pie-body" }, [
      renderDonut(parts, (stats.pct != null ? stats.pct : 0) + "%", "done"),
      legend
    ]));
    return card;
  }

  function renderCategoryBarCard(stats) {
    var card = h("div", { class: "dash-card" });
    card.appendChild(h("div", { class: "dash-card-title" }, "Done vs not done — by category"));
    if (!stats.byCat.length) {
      card.appendChild(h("p", { class: "hint small" }, "No categories yet."));
      return card;
    }
    if (!stats.byCat.some(function (c) { return c.applicable > 0; })) {
      card.appendChild(h("p", { class: "hint small" }, "No task entries in this range."));
      return card;
    }
    var bars = h("div", { class: "dash-bars" });
    stats.byCat.forEach(function (c) {
      var donePct = c.pct != null ? c.pct : 0; // weighted — matches the headline's definition
      bars.appendChild(h("div", { class: "dash-bar-row" }, [
        h("div", { class: "dash-bar-head" }, [
          h("span", { class: "dash-bar-name" }, [h("span", { class: "dash-bar-dot", style: "background:" + c.color + ";" }), c.name || "(unnamed)"]),
          h("span", { class: "dash-bar-val" }, c.applicable ? donePct + "%  ·  " + c.done + "/" + c.applicable : "no entries")
        ]),
        h("div", { class: "dash-bar-track" }, [h("span", { class: "dash-bar-done", style: "width:" + donePct + "%;" })])
      ]));
    });
    card.appendChild(bars);
    return card;
  }

  // --- non-negotiable / other card (tappable on Today, stats otherwise) ---

  // Group heading; the non-negotiable group gets a ★ (via CSS) and, when a
  // count is passed, a "done / total" tally pinned to the right.
  function groupTitle(label, count) {
    var el = h("div", { class: "today-group-title" }, label);
    if (count) el.appendChild(h("span", { class: "today-group-count" }, count));
    return el;
  }

  function renderDashTaskCard(range, stats, todayKey) {
    var card = h("div", { class: "today-card" });
    var split = todaysTasksSplit(todayKey);

    if (range.mode === "today") {
      var applicableToday = function (t) { return isTaskApplicableOn(t, todayKey, todayKey); };
      var nnToday = split.nonNegotiable.filter(applicableToday);
      var otherToday = split.other.filter(applicableToday);
      var nnDone = nnToday.filter(function (t) { return derivedTaskStatus(state, t, todayKey) === "done"; }).length;
      card.appendChild(h("div", { class: "today-card-title" }, "Today · " + formatFriendlyDate(new Date())));
      card.appendChild(h("div", { class: "today-groups" }, [
        h("div", { class: "today-group nonneg" }, [
          groupTitle("Non-negotiable", nnToday.length ? nnDone + "/" + nnToday.length : ""),
          renderTodayTaskList(nnToday, todayKey)
        ]),
        h("div", { class: "today-group other" }, [
          groupTitle("Other tasks", ""),
          renderTodayTaskList(otherToday, todayKey)
        ])
      ]));
      return card;
    }

    function group(label, g, tasks, variant) {
      var pct = g.applicable ? Math.round((g.done / g.applicable) * 100) : null;
      return h("div", { class: "today-group " + variant }, [
        groupTitle(label, ""),
        h("div", { class: "dash-group-pct" }, pct != null ? pct + "%" : "—"),
        h("div", { class: "dash-group-sub" }, g.applicable ? g.done + " of " + g.applicable + " done" : "Nothing scheduled in range"),
        h("div", { class: "dash-bar-track" }, [h("span", { class: "dash-bar-done", style: "width:" + (pct || 0) + "%;" })]),
        renderRangeTaskList(tasks, stats)
      ]);
    }
    card.appendChild(h("div", { class: "today-card-title" }, "Task completion · " + range.label));
    card.appendChild(h("div", { class: "today-groups" }, [
      group("Non-negotiable", stats.byGroup.nonneg, split.nonNegotiable, "nonneg"),
      group("Other tasks", stats.byGroup.other, split.other, "other")
    ]));
    return card;
  }

  // The discipline level line — current tier badge plus a five-stop track
  // (Beginner through Unbreakable) with the fill showing progress through
  // the whole journey, not just the current segment. Always reads "now"
  // (the streak, not the selected Dashboard range) — see "discipline
  // levels", above.
  function renderLevelLine(todayKey) {
    var streak = computeDisciplineStreak(state, todayKey);
    var prog = disciplineProgress(streak);
    var level = DISCIPLINE_LEVELS[prog.levelIdx];
    var next = prog.nextIdx != null ? DISCIPLINE_LEVELS[prog.nextIdx] : null;

    var sub = next
      ? streak + "-day streak · " + (next.days - streak) + " days to " + next.name
      : streak + "-day streak · top level reached";

    var line = h("div", { class: "level-track-line" }, [
      h("div", { class: "level-track-fill", style: "width:" + Math.round(prog.overallFrac * 100) + "%;" })
    ]);
    var stops = h("div", { class: "level-stops" });
    DISCIPLINE_LEVELS.forEach(function (lv, i) {
      var st = i < prog.levelIdx ? "reached" : i === prog.levelIdx ? "current" : "upcoming";
      stops.appendChild(h("div", {
        class: "level-stop " + st,
        title: lv.name + (lv.days ? " · " + lv.days + "+ days" : "")
      }, [h("span", { class: "level-stop-icon" }, lv.icon()), h("span", { class: "level-stop-name" }, lv.name)]));
    });
    var track = h("div", { class: "level-track" }, [line, stops]);

    return h("div", { class: "level-line" }, [
      h("div", { class: "level-badge" }, [
        h("span", { class: "level-badge-icon" }, level.icon()),
        h("div", {}, [
          h("div", { class: "level-badge-eyebrow" }, "Discipline level"),
          h("div", { class: "level-badge-name" }, level.name),
          h("div", { class: "level-badge-sub" }, sub)
        ])
      ]),
      track
    ]);
  }

  function renderDashboard() {
    var root = h("div", { class: "view dashboard" });
    var todayKey = localDateKey(new Date());
    var range = dashRange();
    var stats = computeRangeStats(state, range.startKey, range.endKey, todayKey);

    root.appendChild(h("h1", {}, "Dashboard"));
    root.appendChild(h("p", { class: "hint" }, "Computed from Input Tracker, for the selected time range."));

    root.appendChild(renderDashFilter(range));

    root.appendChild(renderLevelLine(todayKey));

    root.appendChild(h("div", { class: "dash-summary" }, [
      h("span", { class: "dash-summary-range" }, range.label),
      h("span", { class: "dash-summary-main" }, stats.applicable ? stats.pct + "% done" : "No scheduled tasks in range"),
      stats.applicable ? h("span", { class: "dash-summary-sub" }, stats.done + " of " + stats.applicable + " scheduled task-entries") : null
    ]));

    root.appendChild(renderDashTaskCard(range, stats, todayKey));

    root.appendChild(h("div", { class: "dash-charts" }, [
      renderEntryPieCard(stats),
      renderCategoryBarCard(stats)
    ]));

    root.appendChild(h("h2", {}, "By category"));
    var categories = activeCategories(state);
    if (categories.length === 0) {
      root.appendChild(h("p", { class: "hint" }, "No categories yet — add one in Input Tracker."));
      return root;
    }

    var grid = h("div", { class: "kpi-grid" });
    categories.forEach(function (cat) {
      var cs = stats.byCatId[cat.id] || { done: 0, applicable: 0, pct: null };
      grid.appendChild(h("div", { class: "kpi-card", style: "--cat-color:" + cat.color + ";" }, [
        h("div", { class: "kpi-card-name" }, [h("span", { class: "kpi-dot" }), cat.name || "(unnamed category)"]),
        h("div", { class: "kpi-pct" }, cs.pct != null ? cs.pct + "%" : "—"),
        h("div", { class: "kpi-pct-label" }, cs.applicable ? cs.done + " / " + cs.applicable + " entries in range" : "No entries in range"),
        renderTaskStreakList(activeTasksInCategory(state, cat.id), todayKey)
      ]));
    });
    root.appendChild(grid);

    root.appendChild(h("h2", {}, "Progress over time"));
    root.appendChild(renderProgressCard(range, todayKey));

    root.appendChild(h("h2", {}, "Learning"));
    root.appendChild(renderLearningDashCard(range, todayKey));

    root.appendChild(h("h2", {}, "Expenses"));
    root.appendChild(renderExpensesDashCard(range, todayKey));

    root.appendChild(h("h2", {}, "Off track"));
    root.appendChild(renderOffTrackCard(todayKey));

    return root;
  }

  // Split [startKey, endKey] (end clamped to today) into consecutive
  // buckets — days for short ranges, Monday-start weeks up to about a year,
  // calendar months beyond. Shared by the Dashboard's two line charts.
  function rangeBuckets(startKey, endKey, todayKey) {
    var end = endKey < todayKey ? endKey : todayKey;
    if (startKey > end) return { unit: "day", buckets: [] };
    var span = daysBetween(startKey, end) + 1;
    var unit = span <= 62 ? "day" : span <= 400 ? "week" : "month";
    var buckets = [];
    var cursor = parseDateKey(startKey);
    while (localDateKey(cursor) <= end) {
      var next;
      if (unit === "day") next = addDays(cursor, 1);
      else if (unit === "week") next = addDays(getWeekInfo(cursor).weekStart, 7);
      else next = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      var bEnd = localDateKey(addDays(next, -1));
      buckets.push({ startKey: localDateKey(cursor), endKey: bEnd > end ? end : bEnd });
      cursor = next;
    }
    return { unit: unit, buckets: buckets };
  }

  // Calendar days from date key a to date key b (rounded, so DST is fine).
  function daysBetween(a, b) {
    return Math.round((parseDateKey(b) - parseDateKey(a)) / 86400000);
  }

  // Done % per bucket from computeRangeStats; pct is null when nothing was
  // scheduled in a bucket.
  function computeProgressSeries(s, startKey, endKey, todayKey) {
    var r = rangeBuckets(startKey, endKey, todayKey);
    return { unit: r.unit, points: r.buckets.map(function (b) {
      var st = computeRangeStats(s, b.startKey, b.endKey, todayKey);
      return { startKey: b.startKey, endKey: b.endKey, done: st.done, applicable: st.applicable, pct: st.pct };
    }) };
  }

  // ---------- off track ----------
  //
  // A task is "off track" once it has been done at least once and then
  // missed: from the first scheduled day it was missed (a past day left
  // undone, or today once it's explicitly marked Not Done) until the next
  // day it's marked Done. Only the lapses still open today are returned,
  // each with how many calendar days it has been running. Archived tasks
  // and tasks in archived categories are left out.
  function computeOffTrack(s, todayKey) {
    var cats = {};
    activeCategories(s).forEach(function (c) { cats[c.id] = c; });
    var out = [];
    s.tasks.forEach(function (task) {
      var cat = cats[task.categoryId];
      if (!cat || task.archived) return;
      var statuses = s.statusesByTask[task.id] || {};
      var seenDone = false, startKey = null;
      var cursor = parseDateKey(localDateKey(new Date(task.createdAt)));
      for (var dk = localDateKey(cursor); dk <= todayKey; cursor = addDays(cursor, 1), dk = localDateKey(cursor)) {
        if (!isTaskApplicableOn(task, dk, todayKey)) continue;
        var st = statuses[dk];
        if (st === "done") { seenDone = true; startKey = null; }
        else if (seenDone && !startKey && (dk < todayKey || st === "not_done")) startKey = dk;
      }
      if (startKey) out.push({ task: task, category: cat, startKey: startKey, days: daysBetween(startKey, todayKey) });
    });
    return out.sort(function (a, b) { return b.days - a.days; });
  }

  function formatDays(n) {
    var v = Math.round(n * 10) / 10;
    return v + (v === 1 ? " day" : " days");
  }

  function progressPointLabel(p, unit) {
    var d = parseDateKey(p.startKey);
    if (unit === "day") return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    if (unit === "week") return formatWeekRange(d, parseDateKey(p.endKey));
    return d.toLocaleDateString(undefined, { month: "short", year: "numeric" });
  }

  function progressAxisLabel(p, unit) {
    var d = parseDateKey(p.startKey);
    if (unit === "month") return d.toLocaleDateString(undefined, { month: "short", year: "2-digit" });
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  // Line chart of done % per bucket for the Dashboard's range.
  function renderProgressCard(range, todayKey) {
    var series = computeProgressSeries(state, range.startKey, range.endKey, todayKey);
    var unitName = series.unit;
    var card = h("div", { class: "dash-card" });
    card.appendChild(h("div", { class: "dash-card-title" }, "Done % per " + unitName + " · " + range.label));
    card.appendChild(renderLineChart(series, {
      empty: "Nothing scheduled in this range.",
      tipValue: function (p) { return p.pct != null ? p.pct + "% done" : "Nothing scheduled"; },
      tipSub: function (p) { return p.applicable ? p.done + " of " + p.applicable + " entries" : null; },
      aria: "Done % per " + unitName
    }));
    return card;
  }

  // A line chart over a bucketed series ({ unit, points: [{ pct,
  // startKey, endKey, ... }] }) — `pct` is the plotted value, 0..opts.max
  // (default 100); a null value leaves a gap. The plot is a 0–100 viewBox
  // stretched to fit (non-scaling strokes keep the line 2px); labels, dots
  // and the hover readout are HTML laid over it by %.
  // opts: { empty, tipValue(p), tipSub(p), aria, max?, yLabels? [top, mid, bottom] }.
  function renderLineChart(series, opts) {
    var pts = series.points;
    if (pts.length < 2) {
      return h("p", { class: "hint small" }, "A single day has no curve — pick Week, Month, Year or a custom range.");
    }
    if (!pts.some(function (p) { return p.pct != null; })) {
      return h("p", { class: "hint small" }, opts.empty);
    }

    var n = pts.length;
    var max = opts.max || 100;
    function xAt(i) { return (i / (n - 1)) * 100; }
    function yAt(v) { return 100 - (v / max) * 100; }

    // Line and area break across buckets with nothing scheduled.
    var lineD = "", areaD = "", seg = [];
    function flush() {
      if (seg.length > 1) {
        lineD += "M" + seg.map(function (i) { return xAt(i) + " " + yAt(pts[i].pct); }).join(" L");
        areaD += "M" + xAt(seg[0]) + " 100 L" + seg.map(function (i) { return xAt(i) + " " + yAt(pts[i].pct); }).join(" L") + " L" + xAt(seg[seg.length - 1]) + " 100 Z";
      }
      seg = [];
    }
    pts.forEach(function (p, i) { if (p.pct == null) flush(); else seg.push(i); });
    flush();

    var svg = h("svg", { class: "dash-line-svg", viewBox: "0 0 100 100", preserveAspectRatio: "none", "aria-hidden": "true" }, [
      h("line", { class: "dash-line-grid", x1: 0, x2: 100, y1: 0, y2: 0, "vector-effect": "non-scaling-stroke" }),
      h("line", { class: "dash-line-grid", x1: 0, x2: 100, y1: 50, y2: 50, "vector-effect": "non-scaling-stroke" }),
      h("line", { class: "dash-line-base", x1: 0, x2: 100, y1: 100, y2: 100, "vector-effect": "non-scaling-stroke" }),
      h("path", { class: "dash-line-area", d: areaD }),
      h("path", { class: "dash-line-path", d: lineD, "vector-effect": "non-scaling-stroke" })
    ]);

    var plot = h("div", { class: "dash-line-plot" }, svg);

    // Dots: isolated points (no line through them) and the latest point.
    var lastIdx = -1;
    pts.forEach(function (p, i) { if (p.pct != null) lastIdx = i; });
    pts.forEach(function (p, i) {
      if (p.pct == null) return;
      var isolated = (i === 0 || pts[i - 1].pct == null) && (i === n - 1 || pts[i + 1].pct == null);
      if (!isolated && i !== lastIdx) return;
      plot.appendChild(h("span", { class: "dash-line-dot", style: "left:" + xAt(i) + "%;top:" + yAt(p.pct) + "%;" }));
    });

    var cross = h("div", { class: "dash-line-cross" });
    var hoverDot = h("span", { class: "dash-line-dot hover" });
    var tip = h("div", { class: "dash-line-tip" });
    plot.appendChild(cross);
    plot.appendChild(hoverDot);
    plot.appendChild(tip);

    function showAt(i) {
      var p = pts[i];
      plot.classList.add("hovering");
      cross.style.left = xAt(i) + "%";
      hoverDot.style.display = p.pct == null ? "none" : "";
      if (p.pct != null) { hoverDot.style.left = xAt(i) + "%"; hoverDot.style.top = yAt(p.pct) + "%"; }
      var sub = opts.tipSub(p);
      tip.replaceChildren(
        h("div", { class: "dash-line-tip-label" }, progressPointLabel(p, series.unit)),
        h("div", { class: "dash-line-tip-val" }, opts.tipValue(p)),
        sub ? h("div", { class: "dash-line-tip-sub" }, sub) : null
      );
      tip.style.left = xAt(i) + "%";
      tip.classList.toggle("flip", xAt(i) > 60);
    }
    function hide() { plot.classList.remove("hovering"); }
    plot.addEventListener("pointermove", function (e) {
      var r = plot.getBoundingClientRect();
      var frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      showAt(Math.round(frac * (n - 1)));
    });
    plot.addEventListener("pointerleave", hide);

    var yAxis = h("div", { class: "dash-line-y" }, (opts.yLabels || ["100%", "50%", "0%"]).map(function (t) { return h("span", {}, t); }));
    var xIdx = n > 2 ? [0, Math.round((n - 1) / 2), n - 1] : [0, n - 1];
    var xAxis = h("div", { class: "dash-line-x" }, xIdx.map(function (i) {
      return h("span", { style: "left:" + xAt(i) + "%;" }, progressAxisLabel(pts[i], series.unit));
    }));

    var summary = pts.filter(function (p) { return p.pct != null; })
      .map(function (p) { return progressPointLabel(p, series.unit) + ": " + opts.tipValue(p); }).join("; ");
    return h("div", { class: "dash-line-chart", role: "img", "aria-label": opts.aria + ". " + summary }, [
      yAxis, h("div", { class: "dash-line-main" }, [plot, xAxis])
    ]);
  }

  // Learning summary for the Dashboard range: total study time, sessions,
  // items studied / finished, the most-studied items, and a line of study
  // time per bucket (a bucket with no sessions is a real 0, not a gap).
  function renderLearningDashCard(range, todayKey) {
    var end = range.endKey < todayKey ? range.endKey : todayKey;
    var sessions = state.learningSessions.filter(function (x) { return x.date >= range.startKey && x.date <= end; });
    var total = sessions.reduce(function (sum, x) { return sum + x.minutes; }, 0);
    var byItem = {};
    sessions.forEach(function (x) { byItem[x.itemId] = (byItem[x.itemId] || 0) + x.minutes; });
    var finished = state.learningItems.filter(function (i) { return i.status === "done" && i.finishedAt && i.finishedAt >= range.startKey && i.finishedAt <= end; }).length;

    var card = h("div", { class: "dash-card resil-card" });
    card.appendChild(h("div", { class: "dash-card-title" }, "Learning · " + range.label));
    card.appendChild(h("div", { class: "resil-head" }, [
      h("div", { class: "resil-score learn-dash-total" }, total ? formatDuration(total) : "0m"),
      h("div", { class: "resil-text" }, [
        h("div", { class: "resil-main" }, sessions.length
          ? "Studied across " + sessions.length + (sessions.length === 1 ? " session" : " sessions") + " · " + formatDuration(Math.round(total / sessions.length)) + " avg"
          : "No study time logged in this range"),
        h("div", { class: "resil-sub" }, Object.keys(byItem).length + (Object.keys(byItem).length === 1 ? " item" : " items") + " studied · " +
          finished + " finished · " + learningItemsWithStatus(state, "active").length + " in progress now")
      ])
    ]));

    var top = Object.keys(byItem).sort(function (a, b) { return byItem[b] - byItem[a]; }).slice(0, 5);
    if (top.length) {
      card.appendChild(h("div", { class: "resil-open" }, [h("span", { class: "resil-open-label" }, "Most studied:")].concat(top.map(function (id) {
        var item = state.learningItems.find(function (i) { return i.id === id; });
        var kind = learningKind(item ? item.kind : "other");
        return h("span", { class: "learn-dash-chip", style: "--hz-color:" + kind.color + ";" },
          (item ? item.title : "(deleted)") + " · " + formatDuration(byItem[id]));
      }))));
    }

    var r = rangeBuckets(range.startKey, range.endKey, todayKey);
    var series = { unit: r.unit, points: r.buckets.map(function (b) {
      var inB = sessions.filter(function (x) { return x.date >= b.startKey && x.date <= b.endKey; });
      return { startKey: b.startKey, endKey: b.endKey, count: inB.length,
               pct: inB.reduce(function (sum, x) { return sum + x.minutes; }, 0) };
    }) };
    var peak = series.points.reduce(function (m, p) { return Math.max(m, p.pct); }, 0);
    var max = Math.max(60, Math.ceil(peak / 60) * 60); // whole hours, at least 1h
    card.appendChild(h("div", { class: "resil-chart-title" }, "Study time per " + series.unit));
    card.appendChild(total ? renderLineChart(series, {
      max: max,
      yLabels: [formatDuration(max), formatDuration(max / 2), "0"],
      empty: "",
      tipValue: function (p) { return p.pct ? formatDuration(p.pct) + " studied" : "No study time"; },
      tipSub: function (p) { return p.count ? p.count + (p.count === 1 ? " session" : " sessions") : null; },
      aria: "Study time per " + series.unit
    }) : h("p", { class: "hint small" }, "Log study time from the Learning page to see it here."));
    return card;
  }

  // Expenses summary for the Dashboard range: total spent, count/average,
  // top categories, and a line of spend per bucket (a bucket with no
  // expenses is a real 0, not a gap) — mirrors renderLearningDashCard's
  // shape exactly, just for money instead of study minutes.
  function renderExpensesDashCard(range, todayKey) {
    var end = range.endKey < todayKey ? range.endKey : todayKey;
    var expenses = state.expenses.filter(function (x) { return x.date >= range.startKey && x.date <= end; });
    var total = sumCents(expenses, "amountCents");
    var byCat = {};
    expenses.forEach(function (x) {
      var cat = x.category || "Uncategorized";
      byCat[cat] = (byCat[cat] || 0) + x.amountCents;
    });

    var card = h("div", { class: "dash-card resil-card" });
    card.appendChild(h("div", { class: "dash-card-title" }, "Expenses · " + range.label));
    card.appendChild(h("div", { class: "resil-head" }, [
      h("div", { class: "resil-score learn-dash-total" }, formatCents(total)),
      h("div", { class: "resil-text" }, [
        h("div", { class: "resil-main" }, expenses.length
          ? "Logged across " + expenses.length + (expenses.length === 1 ? " expense" : " expenses") + " · " + formatCents(Math.round(total / expenses.length)) + " avg"
          : "No expenses logged in this range"),
        h("div", { class: "resil-sub" }, Object.keys(byCat).length
          ? "Across " + Object.keys(byCat).length + (Object.keys(byCat).length === 1 ? " category" : " categories")
          : null)
      ])
    ]));

    var top = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; }).slice(0, 5);
    if (top.length) {

  // Pointer drag on a card's handle: the card follows the pointer, and the
  // DOM order updates live as it passes a neighbour's midpoint. On release
  // the new order goes to onReorder(ids). offsetTop/offsetLeft ignore
  // transforms, so the card's visual offset is always pointer travel minus
  // how far its slot moved. `horizontal` lists (gym day rows) drag along x
  // and use ←/→ instead of ↑/↓.
  function enablePlanDrag(list, onReorder, horizontal) {
    var pos = horizontal ? "offsetLeft" : "offsetTop";
    var size = horizontal ? "offsetWidth" : "offsetHeight";
    var prevKey = horizontal ? "ArrowLeft" : "ArrowUp";
    var nextKey = horizontal ? "ArrowRight" : "ArrowDown";
    function pointerAt(ev) { return horizontal ? ev.clientX : ev.clientY; }

    function saveOrderFromDom() {
      onReorder(Array.from(list.children).map(function (li) { return li.dataset.id; }));
      render();
    }

    list.addEventListener("pointerdown", function (e) {
      var handle = e.target.closest(".plan-handle");
      if (!handle || e.button !== 0) return;
      var card = handle.closest("[data-id]");
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      var start = pointerAt(e), origin = card[pos];
      var startIndex = Array.from(list.children).indexOf(card);
      card.classList.add("dragging");
      list.classList.add("is-sorting");

      function move(ev) {
        var d = pointerAt(ev) - start;
        var mid = origin + d + card[size] / 2;
        var before = null;
        Array.from(list.children).some(function (li) {
          if (li !== card && mid < li[pos] + li[size] / 2) { before = li; return true; }
          return false;
        });
        if (card.nextElementSibling !== before) list.insertBefore(card, before);
        card.style.transform = (horizontal ? "translateX(" : "translateY(") + (origin + d - card[pos]) + "px)";
      }
      function end() {
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", end);
        handle.removeEventListener("pointercancel", end);
        card.classList.remove("dragging");
        card.style.transform = "";
        list.classList.remove("is-sorting");
        if (Array.from(list.children).indexOf(card) !== startIndex) saveOrderFromDom();
      }
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", end);
      handle.addEventListener("pointercancel", end);
    });

    list.addEventListener("keydown", function (e) {
      if (!e.target.classList.contains("plan-handle") || (e.key !== prevKey && e.key !== nextKey)) return;
      var card = e.target.closest("[data-id]");
      var sib = e.key === prevKey ? card.previousElementSibling : card.nextElementSibling;
      if (!sib) return;
      e.preventDefault();
      var id = card.dataset.id;
      list.insertBefore(card, e.key === prevKey ? sib : sib.nextElementSibling);
      saveOrderFromDom();
      var moved = appEl.querySelector('[data-id="' + id + '"] .plan-handle');
      if (moved) moved.focus();
    });
  }

  // From / To rows, each an hour <select> (00–23) + a minute <select>
  // (:00/:15/:30/:45; an off-grid minute is kept as its own option), with
  // the resulting duration shown underneath. To equal to From is bumped to
  // From + 1h; To earlier than From means "past midnight". onChange(start,
  // end) fires on every edit with "HH:MM" strings.
  function renderPlanTimeControls(start, end, onChange) {
    var durEl = h("div", { class: "plan-time-dur" });

    function clockRow(tag, value) {
      var hrSel = h("select", { "aria-label": tag + " hour" });
      var minSel = h("select", { "aria-label": tag + " minutes" });
      function fill(v) {
        var hr = Math.floor(clockToMinutes(v) / 60), mn = clockToMinutes(v) % 60;
        hrSel.replaceChildren();
        minSel.replaceChildren();
        for (var i = 0; i < 24; i++) hrSel.appendChild(h("option", { value: i, selected: i === hr }, String(i).padStart(2, "0")));
        var mins = [0, 15, 30, 45];
        if (mins.indexOf(mn) === -1) mins.push(mn);
        mins.sort(function (a, b) { return a - b; }).forEach(function (m) {
          minSel.appendChild(h("option", { value: m, selected: m === mn }, String(m).padStart(2, "0")));
        });
      }
      fill(value);
      return {
        el: h("div", { class: "plan-time-row" }, [h("span", { class: "plan-time-tag" }, tag), hrSel, h("span", { class: "plan-time-colon" }, ":"), minSel]),
        get: function () { return minutesToClock(Number(hrSel.value) * 60 + Number(minSel.value)); },
        set: fill,
        onChange: function (fn) { hrSel.addEventListener("change", fn); minSel.addEventListener("change", fn); }
      };
    }

    var from = clockRow("From", start), to = clockRow("To", end);
    function emit() {
      var st = from.get(), en = to.get();
      if (st === en) { en = minutesToClock(clockToMinutes(st) + 60); to.set(en); }
      durEl.textContent = "Duration: " + formatDuration(planCardDuration({ startTime: st, endTime: en }));
      onChange(st, en);
    }
    from.onChange(emit);
    to.onChange(emit);
    durEl.textContent = "Duration: " + formatDuration(planCardDuration({ startTime: start, endTime: end }));
    return h("div", { class: "plan-time" }, [from.el, to.el, durEl]);
  }

  // Mirrors renderGoalDaysLeft's wording/thresholds (days left / due today /
  // overdue), generalized for Finance's own deadline-bearing card.
  function renderFinDeadlineLine(deadline, reached) {
    var text, cls = "fin-days";
    if (reached && deadline) {
      text = "Deadline " + parseDateKey(deadline).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    } else if (!deadline) {
      text = "No deadline";
      cls += " none";
    } else {
      var left = daysBetween(localDateKey(new Date()), deadline);
      var due = parseDateKey(deadline).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      if (left > 0) text = left + (left === 1 ? " day" : " days") + " left · " + due;
      else if (left === 0) { text = "Due today"; cls += " soon"; }
      else { text = -left + (left === -1 ? " day" : " days") + " past the deadline · " + due; cls += " late"; }
      if (left > 0 && left <= 30) cls += " soon";
    }
    return h("span", { class: cls }, text);
  }

  // Drag a card by its handle to any column of the same project's board.
  // The card floats under the pointer (position: fixed) while a dashed
  // placeholder marks where it will land; on release the card takes the
  // placeholder's column and position. Keyboard on a focused handle:
  // ←/→ moves it to the previous/next column (to the bottom), ↑/↓ moves
  // it within its column.
  function enableKanbanDrag(board) {
    function idsIn(list, swapFrom, swapTo) {
      return Array.from(list.children).map(function (li) { return li === swapFrom ? swapTo : li.dataset.id; }).filter(Boolean);
    }
    function refocus(id) {
      var el = appEl.querySelector('.kb-card[data-id="' + id + '"] .kb-handle');
      if (el) el.focus();
    }

    board.addEventListener("pointerdown", function (e) {
      var handle = e.target.closest(".kb-handle");
      if (!handle || e.button !== 0) return;
      e.preventDefault();
      var card = handle.closest(".kb-card");
      var rect = card.getBoundingClientRect();
      var offX = e.clientX - rect.left, offY = e.clientY - rect.top;
      var placeholder = h("li", { class: "kb-placeholder", style: "height:" + rect.height + "px;" });
      card.parentNode.insertBefore(placeholder, card);
      card.style.setProperty("--hz-color", getComputedStyle(card).getPropertyValue("--hz-color")); // keep the project colour once it leaves the card
      card.classList.add("kb-dragging");
      card.style.width = rect.width + "px";
      card.style.left = rect.left + "px";
      card.style.top = rect.top + "px";
      appEl.appendChild(card);

      function move(ev) {
        card.style.left = (ev.clientX - offX) + "px";
        card.style.top = (ev.clientY - offY) + "px";
        var under = document.elementFromPoint(ev.clientX, ev.clientY);
        var col = under && under.closest(".kb-col");
        if (!col || !board.contains(col)) return;
        var list = col.querySelector(".kb-list");
        var before = null;
        Array.from(list.children).some(function (li) {
          if (li === placeholder) return false;
          var r = li.getBoundingClientRect();
          if (ev.clientY < r.top + r.height / 2) { before = li; return true; }
          return false;
        });
        if (placeholder.parentNode !== list || placeholder.nextElementSibling !== before) list.insertBefore(placeholder, before);
      }
      function up() {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        document.removeEventListener("pointercancel", up);
        var list = placeholder.parentNode;
        moveProjectTask(state, card.dataset.id, list.dataset.status, idsIn(list, placeholder, card.dataset.id));
        render();
      }
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      document.addEventListener("pointercancel", up);
    });

    board.addEventListener("keydown", function (e) {
      if (!e.target.classList.contains("kb-handle")) return;
      var card = e.target.closest(".kb-card");
      var id = card.dataset.id;
      var list = card.parentNode;
      var lists = Array.from(board.querySelectorAll(".kb-list"));
      var li = lists.indexOf(list);
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        var target = lists[li + (e.key === "ArrowLeft" ? -1 : 1)];
        if (!target) return;
        e.preventDefault();
        target.appendChild(card);
        moveProjectTask(state, id, target.dataset.status, idsIn(target));
      } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        var sib = e.key === "ArrowUp" ? card.previousElementSibling : card.nextElementSibling;
        if (!sib) return;
        e.preventDefault();
        list.insertBefore(card, e.key === "ArrowUp" ? sib : sib.nextElementSibling);
        moveProjectTask(state, id, list.dataset.status, idsIn(list));
      } else return;
      render();
      refocus(id);
    });
  }

  function renderLearningCard(item) {

  // ---------- Journal ----------

  // A top "＋ New entry" button opens a popup (date + note); a searchable

  // editable there) — to log a different day, open a fresh "＋ New entry".
  function renderJournal() {
    var root = h("div", { class: "view journal" });
    root.appendChild(h("div", { class: "view-header" }, [
      h("h1", {}, "Journal"),
      h("button", { class: "header-add-btn", onclick: function () { creatingJournalEntry = true; render(); } }, "＋ New entry")

  // Search box over entry cards (newest date first); filtering hides cards
  // in place, same as Learning's Notes tab, so typing keeps focus.
  function renderJournalBrowse() {
    var entries = journalEntriesSorted(state);
    if (!entries.length) return [h("p", { class: "hint project-empty" }, "No entries yet — use ＋ New entry to start.")];

    var grid = h("div", { class: "learn-grid" });
    var cards = entries.map(function (e) {
      var card = renderJournalCard(e);
      grid.appendChild(card);
      return { el: card, hay: (e.body || "").toLowerCase() };
    });
    var emptyMsg = h("p", { class: "hint project-empty", style: "display:none;" }, "No entries match.");

    function apply() {
      var q = journalSearch.trim().toLowerCase();
      var shown = 0;
      cards.forEach(function (c) {
        var ok = !q || c.hay.indexOf(q) !== -1;
        c.el.style.display = ok ? "" : "none";
        if (ok) shown++;
      });
      emptyMsg.style.display = shown ? "none" : "";
    }
    var search = h("input", {
      type: "text", class: "learn-note-search", placeholder: "Search entries…", value: journalSearch,
      oninput: function (e) { journalSearch = e.target.value; apply(); }
    });
    apply();
    return [h("div", { class: "learn-note-tools" }, [search]), grid, emptyMsg];
  }

  // ---------- Goals ----------

  var HORIZONS = [
    { key: "short", label: "Short-term", sub: "6 to 12 months", color: "#c98a2e" },
    { key: "mid", label: "Mid-term", sub: "1 to 5 years", color: "#3a7ca5" },

  // The identity statement is a locked card: read-only text plus "✎ Edit".
  // Edit swaps in a textarea with Save / Cancel; nothing is written until
  // Save, and saving locks it again. With no statement yet it offers to
  // write one.
  function renderIdentityCard() {
    var text = state.identityStatement || "";
    if (!editingIdentity) {
      return h("div", { class: "identity-card" + (text ? "" : " empty") }, [
        h("p", { class: "identity-text" }, text || "No identity statement yet."),
        h("button", { class: "secondary-btn identity-edit-btn", onclick: function () { editingIdentity = true; render(); } }, text ? "✎ Edit" : "＋ Write it")
      ]);
    }
    var input = h("textarea", {
      class: "identity-block",
      placeholder: "e.g. I'm becoming the kind of person who shows up daily on their goals, ships consistently, and keeps promises to themself."
    }, text);
    function save() { updateIdentityText(state, input.value.trim()); editingIdentity = false; render(); }
    function cancel() { editingIdentity = false; render(); }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Escape") cancel();
      else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) save();
    });
    setTimeout(function () { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
    return h("div", { class: "identity-card editing" }, [
      input,
      h("div", { class: "identity-actions" }, [
        h("button", { class: "secondary-btn", onclick: cancel }, "Cancel"),
        h("button", { class: "modal-primary", onclick: save }, "Save")
      ])
    ]);
  }

  function renderHorizonSection(hz) {
    var section = h("div", { class: "horizon-section", style: "--hz-color:" + hz.color + ";" });
    section.appendChild(h("div", { class: "horizon-head" }, [
      h("h2", { class: "horizon-title" }, hz.label),
      h("span", { class: "horizon-sub" }, hz.sub)
    ]));

    // Goals in priority order (their `order`, set by dragging ⋮⋮ or ↑/↓).
    // Reached goals (live progress at 100%) sit below a "Reached" divider;
    // each group is its own draggable list, so a drag never crosses it.
    var goals = activeGoalsByHorizon(state, hz.key);
    if (goals.length === 0) {
      section.appendChild(h("p", { class: "hint" }, "No " + hz.label.toLowerCase() + " goals yet."));
    } else {
      var open = goals.filter(function (g) { return goalEffectiveProgress(g).pct < 100; });
      var reached = goals.filter(function (g) { return goalEffectiveProgress(g).pct >= 100; });
      var grid = h("div", { class: "goal-grid" });
      [open, reached].forEach(function (group, gi) {
        if (!group.length) return;
        if (gi === 1) grid.appendChild(h("div", { class: "goal-reached-divider" }, "Reached"));
        var list = h("div", { class: "goal-list" });
        group.forEach(function (goal) {
          list.appendChild(h("div", { class: "goal-item", "data-id": goal.id }, [
            renderGoalCard(goal),
            h("button", { class: "plan-handle goal-handle", title: "Drag to change priority (or ↑/↓)", "aria-label": "Move " + (goal.name || "goal") }, "⋮⋮")
          ]));
        });
        if (group.length > 1) enablePlanDrag(list, function (ids) { reorderByIds(state, state.goals, ids); });
        grid.appendChild(list);
      });
      section.appendChild(grid);
    }

    return section;
  }

  // A goal card shows its name, a progress bar, a "Linked" / "Manual"
  // indicator (is the progress live-tracked or hand-entered?), and an
  // Overdue badge when applicable. The whole card is a button — clicking
  // anywhere on it opens the Edit popup (renderGoalEditModal). Progress is
  // derived by goalEffectiveProgress, so linked goals reflect current
  // Input Tracker / child-goal state with no manual refresh.
  function renderGoalCard(goal) {
    var prog = goalEffectiveProgress(goal);
    var pct = prog.pct;

    var card = h("button", {
      class: "goal-card" + (pct >= 100 ? " reached" : ""),
      title: "Edit " + (goal.name || "goal"),
      onclick: function () { editingGoalId = goal.id; render(); }
    }, [
      h("span", { class: "goal-card-name" }, goal.name || "(unnamed goal)"),
      h("span", { class: "goal-progress-track" }, [
        h("span", { class: "goal-progress-fill", style: "width:" + pct + "%;" })
      ])
    ]);

    var srcLabel = prog.source === "rollup" ? "Rolled up" : prog.source === "linked" ? "Linked" : "Manual";
    var metaRow = h("span", { class: "goal-progress-meta" }, [
      h("span", {}, pct + "%"),
      h("span", { class: "goal-source" + (prog.source === "manual" ? "" : " auto") }, srcLabel)
    ]);
    if (pct >= 100) metaRow.appendChild(h("span", { class: "goal-reached" }, "✓ Reached"));
    if (isGoalOverdue(goal, pct)) metaRow.appendChild(h("span", { class: "goal-overdue" }, "Overdue"));
    card.appendChild(metaRow);
    card.appendChild(renderGoalDaysLeft(goal, pct));

    return card;
  }

  // Bottom line of a goal card: days remaining until its deadline ("245 days
  // left · Jun 5, 2027"), "Due today", or how many days past it. A reached
  // goal just shows its deadline date (no countdown); no deadline says so.
  function renderGoalDaysLeft(goal, pct) {
    var text, cls = "goal-days";
    if (pct >= 100 && goal.deadline) {
      text = "Deadline " + parseDateKey(goal.deadline).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    } else if (!goal.deadline) {
      text = "No deadline";
      cls += " none";
    } else {
      var left = daysBetween(localDateKey(new Date()), goal.deadline);
      var due = parseDateKey(goal.deadline).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      if (left > 0) text = left + (left === 1 ? " day" : " days") + " left · " + due;
      else if (left === 0) { text = "Due today"; cls += " soon"; }
      else { text = -left + (left === -1 ? " day" : " days") + " past the deadline · " + due; cls += " late"; }
      if (left > 0 && left <= 30) cls += " soon";
    }
    return h("span", { class: cls }, text);
  }

  // Small shared helper: a labelled field for the modal bodies.
  function modalField(labelText, control) {
    return [h("div", { class: "goal-field-label" }, labelText), control];
  }

  // The "＋ New goal" button (top of renderGoals) opens this. Draft values
  // live only in this closure until "＋ Add goal" is pressed. The body
  // rebuilds when the horizon changes, since a short-term goal also gets
  // the task-link fields and a short/mid goal gets a "ladders up to" pick.
  function renderGoalCreateModal() {
    var draft = { horizon: "short", deadline: "", parentGoalId: "", linkType: null, taskIds: [], countTarget: "" };
    function close() { closeModal(function () { creatingGoal = false; render(); }); }

    var nameInput = h("input", { type: "text", placeholder: "Goal name" });

    function submit() {
      var name = nameInput.value.trim();
      if (!name) { alert("Give the goal a name first."); nameInput.focus(); return; }
      var opts = { name: name, deadline: draft.deadline || null, parentGoalId: draft.parentGoalId || null };
      if (draft.horizon === "short" && draft.linkType) {
        opts.linkType = draft.linkType;
        opts.linkedTaskIds = draft.taskIds.slice();
        if (draft.linkType === "count") {
          var n = parseInt(draft.countTarget, 10);
          opts.countTarget = (isNaN(n) || n <= 0) ? null : n;
        }
      }
      addGoal(state, draft.horizon, opts);
      close();
    }

    var body = h("div", { class: "modal-body" });
    function field(label, control) { modalField(label, control).forEach(function (n) { body.appendChild(n); }); }

    function rebuildBody() {
      body.innerHTML = "";
      field("Name", nameInput);

      var horizonSelect = h("select", { onchange: function (e) { draft.horizon = e.target.value; draft.parentGoalId = ""; rebuildBody(); } });
      HORIZONS.forEach(function (o) { horizonSelect.appendChild(h("option", { value: o.key, selected: o.key === draft.horizon }, o.label)); });
      field("Horizon", horizonSelect);

      field("Deadline", h("input", { type: "date", value: draft.deadline, onchange: function (e) { draft.deadline = e.target.value; } }));

      var pk = PARENT_HORIZON[draft.horizon];
      if (pk) {
        var pl = HORIZONS.filter(function (x) { return x.key === pk; })[0].label.toLowerCase();
        var ps = h("select", { onchange: function (e) { draft.parentGoalId = e.target.value; } });
        ps.appendChild(h("option", { value: "" }, "— none —"));
        activeGoalsByHorizon(state, pk).forEach(function (pg) { ps.appendChild(h("option", { value: pg.id, selected: draft.parentGoalId === pg.id }, pg.name || "(unnamed goal)")); });
        field("Ladders up to (" + pl + " goal)", ps);
      }

      if (draft.horizon === "short") {
        var row = h("div", { class: "goal-src-row" });
        [["", "Manual"], ["rate", "Rate-based"], ["count", "Count-based"]].forEach(function (m) {
          row.appendChild(h("button", {
            class: "mode-btn" + ((draft.linkType || "") === m[0] ? " active" : ""),
            onclick: function () { draft.linkType = m[0] || null; rebuildBody(); }
          }, m[1]));
        });
        field("Progress", row);
        if (draft.linkType === "count") {
          field("Target count", h("input", { type: "number", min: "1", step: "1", value: draft.countTarget, placeholder: "e.g. 500", oninput: function (e) { draft.countTarget = e.target.value; } }));
        }
        if (draft.linkType) {
          field("Linked tasks", renderTaskLinkPicker(draft.taskIds, function (id, on) {
            var i = draft.taskIds.indexOf(id);
            if (on && i === -1) draft.taskIds.push(id);
            else if (!on && i !== -1) draft.taskIds.splice(i, 1);
          }));
        }
      }
    }
    rebuildBody();

    var dialog = h("div", { class: "modal-dialog" }, [
      h("div", { class: "modal-head" }, [
        h("div", { class: "modal-title" }, "New goal"),
        h("button", { class: "icon-btn", title: "Cancel", onclick: close }, "✕")
      ]),
      body,
      h("div", { class: "modal-actions" }, [
        h("button", { class: "secondary-btn", onclick: close }, "Cancel"),
        h("button", { class: "modal-primary", onclick: submit }, "＋ Add goal")
      ])
    ]);

    var overlay = modalOverlay(dialog, close);
    setTimeout(function () { nameInput.focus(); }, 0);
    return overlay;
  }

  // A scrollable checklist of active Input Tracker tasks ("Category · Task")
  // for linking a short-term goal to tracker data. onToggle(taskId, checked).
  function renderTaskLinkPicker(selectedIds, onToggle) {
    var list = h("div", { class: "tasklink-list" });
    var activeTasks = state.tasks.filter(function (t) { return !t.archived; });
    if (!activeTasks.length) {
      list.appendChild(h("div", { class: "hint small" }, "No tasks in Input Tracker yet."));
      return list;
    }
    var catName = {};
    state.categories.forEach(function (c) { catName[c.id] = c.name || "(unnamed)"; });
    activeTasks
      .slice()
      .sort(function (a, b) { return (catName[a.categoryId] || "").localeCompare(catName[b.categoryId] || "") || a.order - b.order; })
      .forEach(function (t) {
        var cb = h("input", { type: "checkbox", checked: selectedIds.indexOf(t.id) !== -1 });
        cb.addEventListener("change", function () { onToggle(t.id, cb.checked); });
        list.appendChild(h("label", { class: "tasklink-item" }, [
          cb, h("span", {}, (catName[t.categoryId] || "—") + " · " + (t.name || "(unnamed task)"))
        ]));
      });
    return list;
  }

  // Clicking a goal card opens this. Every field autosaves immediately.
  // The Progress area depends on the goal: a short-term goal chooses
  // Manual / Rate-based / Count-based and (for the latter two) links Input
  // Tracker tasks; a mid/long goal rolls up from child goals if any ladder
  // into it, else falls back to a manual slider. goalEffectiveProgress is
  // the single source of truth for the displayed number.
  function renderGoalEditModal(goal) {
    function close() { closeModal(function () { editingGoalId = null; render(); }); }
    function readGoal() { return state.goals.find(function (x) { return x.id === goal.id; }) || goal; }
    function childGoals(g) { return state.goals.filter(function (x) { return !x.archived && x.parentGoalId === g.id; }); }
    function activeLinkedTasks(g) {
      return (g.linkedTaskIds || [])
        .map(function (id) { return state.tasks.find(function (t) { return t.id === id; }); })
        .filter(function (t) { return t && !t.archived; });
    }

    var hz = HORIZONS.filter(function (x) { return x.key === goal.horizon; })[0] || HORIZONS[0];

    var nameInput = h("input", {
      type: "text", value: goal.name, placeholder: "Goal name",
      oninput: function (e) { updateGoalField(state, goal.id, "name", e.target.value); }
    });

    var horizonSelect = h("select", {
      onchange: function (e) { updateGoalField(state, goal.id, "horizon", e.target.value); render(); }
    });
    HORIZONS.forEach(function (opt) {
      horizonSelect.appendChild(h("option", { value: opt.key, selected: goal.horizon === opt.key }, opt.label));
    });

    var deadlineRow = h("div", { class: "goal-deadline-row" });
    deadlineRow.appendChild(h("input", {
      type: "date", value: goal.deadline || "",
      onchange: function (e) { updateGoalField(state, goal.id, "deadline", e.target.value || null); refreshBadge(); }
    }));
    function refreshBadge() {
      var existing = deadlineRow.querySelector(".goal-overdue");
      var shouldShow = isGoalOverdue(readGoal());
      if (shouldShow && !existing) deadlineRow.appendChild(h("span", { class: "goal-overdue" }, "Overdue"));
      else if (!shouldShow && existing) deadlineRow.removeChild(existing);
    }

    // "Ladders up to" (parent goal, one horizon up) — feeds the parent's roll-up.
    var parentNodes = [];
    var parentKey = PARENT_HORIZON[goal.horizon];
    if (parentKey) {
      var parentLabel = HORIZONS.filter(function (x) { return x.key === parentKey; })[0].label.toLowerCase();
      var parentSelect = h("select", {
        onchange: function (e) { updateGoalField(state, goal.id, "parentGoalId", e.target.value || null); }
      });
      parentSelect.appendChild(h("option", { value: "" }, "— none —"));
      activeGoalsByHorizon(state, parentKey).forEach(function (pg) {
        parentSelect.appendChild(h("option", { value: pg.id, selected: goal.parentGoalId === pg.id }, pg.name || "(unnamed goal)"));
      });
      parentNodes = modalField("Ladders up to (" + parentLabel + " goal)", parentSelect);
    }

    // --- Progress area ---
    var progressWrap = h("div", { class: "goal-progress-field" });
    var readoutBox = h("div", { class: "goal-readout" });

    function buildSlider(g) {
      var pv = h("span", { class: "percent-value" }, (g.percent || 0) + "%");
      var range = h("input", {
        type: "range", min: "0", max: "100", step: "5", value: String(g.percent || 0),
        oninput: function (e) {
          var val = Number(e.target.value);
          updateGoalField(state, goal.id, "percent", val);
          pv.textContent = val + "%";
          refreshBadge();
        }
      });
      return h("div", { class: "percent-row" }, [range, pv]);
    }

    // Value-only refresh (typing a target, ticking a task, changing a child)
    // — never rebuilds the controls, so inputs keep focus.
    function fillReadout() {
      readoutBox.innerHTML = "";
      readoutBox.style.display = "";
      var g = readGoal();
      var prog = goalEffectiveProgress(g);
      if (prog.source === "manual") {
        if (g.horizon === "short" && g.linkType) {
          readoutBox.appendChild(h("div", { class: "goal-linked-sub" },
            "Not linked yet — showing the manual fallback (" + (g.percent || 0) + "%). " +
            (g.linkType === "count" && !(g.countTarget > 0) ? "Set a target count." : "Tick at least one task.")));
        } else {
          readoutBox.style.display = "none";
        }
        refreshBadge();
        return;
      }
      readoutBox.appendChild(h("div", { class: "goal-linked-readout" }, "Live progress: " + prog.pct + "%"));
      if (prog.source === "rollup") {
        var kids = childGoals(g);
        readoutBox.appendChild(h("div", { class: "goal-linked-sub" }, "average of " + kids.length + " child goal" + (kids.length === 1 ? "" : "s")));
        var listEl = h("div", { class: "goal-rollup-list" });
        kids.forEach(function (c) { listEl.appendChild(h("div", {}, "· " + (c.name || "(unnamed)") + " — " + goalEffectiveProgress(c).pct + "%")); });
        readoutBox.appendChild(listEl);
      } else {
        var tasks = activeLinkedTasks(g);
        if (g.linkType === "rate") {
          readoutBox.appendChild(h("div", { class: "goal-linked-sub" }, "average of " + tasks.length + " linked task" + (tasks.length === 1 ? "" : "s") + "' accomplishment %"));
        } else {
          var total = tasks.reduce(function (s, t) { return s + countDoneEntries(state, t.id); }, 0);
          readoutBox.appendChild(h("div", { class: "goal-linked-sub" }, total + " / " + g.countTarget + " done entries counted"));
        }
      }
      refreshBadge();
    }

    // Structure rebuild (mode switch / horizon change / gaining-losing children).
    function rebuildProgress() {
      progressWrap.innerHTML = "";
      var g = readGoal();

      if (g.horizon === "short") {
        var row = h("div", { class: "goal-src-row" });
        [["", "Manual"], ["rate", "Rate-based"], ["count", "Count-based"]].forEach(function (m) {
          row.appendChild(h("button", {
            class: "mode-btn" + ((g.linkType || "") === m[0] ? " active" : ""),
            onclick: function () { updateGoalField(state, goal.id, "linkType", m[0] || null); rebuildProgress(); }
          }, m[1]));
        });
        progressWrap.appendChild(row);

        if (!g.linkType) {
          progressWrap.appendChild(buildSlider(g));
          return;
        }
        if (g.linkType === "count") {
          progressWrap.appendChild(h("div", { class: "goal-field-label" }, "Target count"));
          progressWrap.appendChild(h("input", {
            type: "number", min: "1", step: "1", value: g.countTarget || "", placeholder: "e.g. 500",
            oninput: function (e) {
              var n = parseInt(e.target.value, 10);
              updateGoalField(state, goal.id, "countTarget", (isNaN(n) || n <= 0) ? null : n);
              fillReadout();
            }
          }));
        }
        progressWrap.appendChild(h("div", { class: "goal-field-label" }, "Linked tasks"));
        progressWrap.appendChild(renderTaskLinkPicker((g.linkedTaskIds || []), function (taskId, on) {
          var cur = (readGoal().linkedTaskIds || []).slice();
          var i = cur.indexOf(taskId);
          if (on && i === -1) cur.push(taskId);
          else if (!on && i !== -1) cur.splice(i, 1);
          updateGoalField(state, goal.id, "linkedTaskIds", cur);
          fillReadout();
        }));
        progressWrap.appendChild(readoutBox);
        fillReadout();
        return;
      }

      // mid / long
      var kids = childGoals(g);
      if (kids.length) {
        progressWrap.appendChild(readoutBox);
        fillReadout();
      } else {
        progressWrap.appendChild(h("div", { class: "goal-linked-sub" }, "No child goals ladder up here yet — progress is manual."));
        progressWrap.appendChild(buildSlider(g));
      }
    }
    rebuildProgress();
    refreshBadge();

    var dialog = h("div", { class: "modal-dialog", style: "--hz-color:" + hz.color + ";" }, [
      h("div", { class: "modal-head" }, [
        h("div", { class: "modal-title" }, "Edit goal"),
        h("button", { class: "icon-btn", title: "Done", onclick: close }, "✕")
      ]),
      h("div", { class: "modal-body" }, [].concat(
        modalField("Name", nameInput),
        modalField("Horizon", horizonSelect),
        modalField("Deadline", deadlineRow),
        parentNodes,
        modalField("Progress", progressWrap)
      )),
      h("div", { class: "modal-actions spread" }, [
        h("button", { class: "icon-btn", onclick: function () { closeModal(function () { archiveGoal(state, goal.id); editingGoalId = null; render(); }); } }, "Archive goal"),
        h("button", { class: "modal-primary", onclick: close }, "Done")
      ])
    ]);

    var overlay = modalOverlay(dialog, close);
    setTimeout(function () { nameInput.focus(); }, 0);
    return overlay;
  }

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
